name: Hustle Mobile Cloud CI

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile-cloud-validation.yml'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile-cloud-validation.yml'

permissions:
  contents: read

jobs:
  mobile-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate mobile experience integration
        run: node apps/mobile/scripts/mobile-experience-contract.mjs
      - name: Check cloud EAS preview configuration safeguards
        run: node apps/mobile/scripts/cloud-preview-config-gate.cjs
      - name: Verify offline demo safety and synthetic interaction coverage
        run: node apps/mobile/scripts/offline-demo-contract.cjs
      - name: Verify SDK54 Android autolinking is compatible
        working-directory: apps/mobile
        shell: bash
        run: |
          npx expo-modules-autolinking resolve --platform android --json > /tmp/hustle-ci-native-modules.json
          node scripts/check-native-autolinking.cjs /tmp/hustle-ci-native-modules.json
      - name: Prevent duplicate React dispatcher crash on Android
        run: node apps/mobile/scripts/react-singleton-contract.cjs
      - name: Validate UX004-A1.1 Hybrid tokens and demo-only primitives
        run: node apps/mobile/scripts/ux004-a11-contract.cjs
      - name: Validate UX004-A1.2 floating navigation, demo state and insets
        run: node apps/mobile/scripts/ux004-a12-navigation-contract.cjs
      - name: Validate UX004-A1.3 Android Back, keyboard and safe-area contracts
        run: node apps/mobile/scripts/ux004-a13-android-back-contract.cjs
      - name: Audit UX004-A1.4 cumulative integration readiness and device review gates
        run: node apps/mobile/scripts/ux004-a14-integration-audit.cjs
      - name: Validate UX004-A2.1 offline Feed gestures and caption controls
        run: node apps/mobile/scripts/ux004-a21-feed-contract.cjs
      - name: Validate UX004-A2.2 comment threads and named collections
        run: node apps/mobile/scripts/ux004-a22-social-contract.cjs
      - name: Verify UX004-A2.3 sample offer card and illustrated poster safeguards
        run: node apps/mobile/scripts/ux004-a23-offer-contract.cjs
      - name: Validate UX004-A2.4 cumulative Feed and social integration
        run: node apps/mobile/scripts/ux004-a24-integration-contract.cjs
      - name: Validate UX004-A2.5 Explore to Feed work navigation
        run: node apps/mobile/scripts/ux004-a25-explore-work-contract.cjs
      - name: Validate UX004-A2.6 content-aware Explore search
        run: node apps/mobile/scripts/ux004-a26-explore-search-contract.cjs
      - name: Validate UX004-A2.7 Explore save and named collection continuity
        run: node apps/mobile/scripts/ux004-a27-explore-save-contract.cjs
      - name: Validate UX004-A2.8 local saved-work Explore filter
        run: node apps/mobile/scripts/ux004-a28-saved-filter-contract.cjs
      - name: Validate UX004-A2.9 saved work by named collection
        run: node apps/mobile/scripts/ux004-a29-collection-filter-contract.cjs
      - name: Validate connected mobile Explore search record contract and safe links
        run: node apps/mobile/scripts/mobile-a31-connected-search-contract.cjs
      - name: Check Expo mobile TypeScript
        run: npm run typecheck --workspace=@hustle/mobile
      - name: Bundle offline Android demo with Metro (no EAS build credits)
        working-directory: apps/mobile
        env:
          APP_VARIANT: preview
          EXPO_PUBLIC_HUSTLE_DEMO: "true"
          EXPO_PUBLIC_HUSTLE_ENABLE_BOOKING_REQUESTS: "false"
        run: npx expo export --platform android --output-dir /tmp/hustle-offline-android-metro --clear

