name: Hustle Mobile Cloud CI

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile-cloud-validation.yml'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile-cloud-validation.yml'

permissions:
  contents: read

jobs:
  mobile-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate mobile experience integration
        run: node apps/mobile/scripts/mobile-experience-contract.mjs
      - name: Check cloud EAS preview configuration safeguards
        run: node apps/mobile/scripts/cloud-preview-config-gate.cjs
      - name: Verify offline demo safety and synthetic interaction coverage
        run: node apps/mobile/scripts/offline-demo-contract.cjs
      - name: Verify SDK54 Android autolinking is compatible
        working-directory: apps/mobile
        shell: bash
        run: |
          npx expo-modules-autolinking resolve --platform android --json > /tmp/hustle-ci-native-modules.json
          node scripts/check-native-autolinking.cjs /tmp/hustle-ci-native-modules.json
      - name: Prevent duplicate React dispatcher crash on Android
        run: node apps/mobile/scripts/react-singleton-contract.cjs
      - name: Check Expo mobile TypeScript
        run: npm run typecheck --workspace=@hustle/mobile
      - name: Bundle offline Android demo with Metro (no EAS build credits)
        working-directory: apps/mobile
        env:
          APP_VARIANT: preview
          EXPO_PUBLIC_HUSTLE_DEMO: "true"
          EXPO_PUBLIC_HUSTLE_ENABLE_BOOKING_REQUESTS: "false"
        run: npx expo export --platform android --output-dir /tmp/hustle-offline-android-metro --clear

