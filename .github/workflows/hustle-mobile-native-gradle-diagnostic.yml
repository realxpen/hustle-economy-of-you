name: Hustle Connected Android Preview (free CI)

# Internal test APK only. No EAS credits, tokens, store signing or publication.
on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'package-lock.json'
      - '.github/workflows/hustle-mobile-native-gradle-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hustle-connected-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: '1'
      APP_VARIANT: preview
      EXPO_PUBLIC_HUSTLE_RUNTIME_SCOPE: isolated-staging
      EXPO_PUBLIC_HUSTLE_AUTH_PROVIDER: expo-better-auth
      EXPO_PUBLIC_HUSTLE_AUTH_URL: https://hustle-isolated-staging-api.vercel.app/api/auth
      EXPO_PUBLIC_HUSTLE_DEMO: 'false'
      EXPO_PUBLIC_HUSTLE_ENABLE_ENQUIRY_MESSAGES: 'true'
      EXPO_PUBLIC_HUSTLE_ENABLE_BOOKING_REQUESTS: 'false'
      EXPO_PUBLIC_API_URL: https://hustle-isolated-staging-api.vercel.app/api/v1
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install exact monorepo dependencies
        run: npm ci
      - name: Verify isolated identity and configuration
        run: |
          node apps/mobile/scripts/cloud-preview-config-gate.cjs
          node apps/mobile/scripts/staging-device-readiness-contract.cjs
          npm run typecheck --workspace=@hustle/mobile
      - name: Check Expo native package compatibility (diagnostic)
        working-directory: apps/mobile
        shell: bash
        run: |
          npx expo install --check || echo "::warning::Expo dependency check reported incompatibilities; see diagnostics above."
      - name: Identify malformed Expo autolinked module metadata
        working-directory: apps/mobile
        shell: bash
        run: |
          npx expo-modules-autolinking resolve --platform android --json > /tmp/hustle-autolink-modules.json
          node - <<'NODE'
          const fs = require('node:fs');
          const v = JSON.parse(fs.readFileSync('/tmp/hustle-autolink-modules.json', 'utf8'));
          const mods = Array.isArray(v.modules) ? v.modules : [];
          console.log('Expo autolink module count:', mods.length);
          const broken = [];
          mods.forEach((m, i) => {
            const projects = m.projects || [];
            console.log('module [' + i + ']:', m.packageName, m.packageVersion, 'projects:', projects.map(p => ({ name: p.name, publicationVersionPresent: !!p.publication?.version })));
            for (const p of projects) {
              if (p.publication && !p.publication.version) broken.push({ name: m.packageName, moduleIndex: i, project: p.name });
            }
          });
          if (broken.length) {
            console.error('Malformed Expo Android module publication metadata:', JSON.stringify(broken));
            process.exitCode = 1;
          }
          NODE
      - name: Generate a fresh Android project without release credentials or EAS
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean --non-interactive
      - name: Compile connected staging Android release in GitHub cloud
        working-directory: apps/mobile/android
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --stacktrace --no-daemon --max-workers=2 --warning-mode=summary 2>&1 | tee /tmp/hustle-native-gradle-diagnostic.log
      - name: Verify signed staging package and prepare installable artifact
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node apps/mobile/scripts/package-staging-apk.cjs apps/mobile/android/app/build/outputs/apk/release/app-release.apk /tmp/hustle-connected-android
      - name: Upload internal connected APK and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hustle-connected-staging-android
          path: /tmp/hustle-connected-android/
          if-no-files-found: error
          retention-days: 7
      - name: Upload sanitized diagnostic metadata (no APK)
        if: failure()
        shell: bash
        run: |
          echo "Native Gradle diagnostic failed. The Gradle job log is available in GitHub Actions."
          echo "### Android compiler diagnosis" >> "$GITHUB_STEP_SUMMARY"
          echo "Inspect **Compile connected staging Android release in GitHub cloud** for the first Gradle failure and root-cause message. No EAS build credits were used." >> "$GITHUB_STEP_SUMMARY"
