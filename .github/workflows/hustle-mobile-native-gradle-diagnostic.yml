name: Hustle Android Native Gradle Diagnostic (free CI)

# Reuses the previously verified Gradle build path. Produces a standalone
# INTERNAL TEST APK, never a store/production release or a paid EAS build.
on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'package-lock.json'
      - '.github/workflows/hustle-mobile-native-gradle-diagnostic.yml'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'package-lock.json'
      - '.github/workflows/hustle-mobile-native-gradle-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hustle-connected-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
      APP_VARIANT: preview
      EXPO_PUBLIC_HUSTLE_DEMO: 'false'
      EXPO_PUBLIC_HUSTLE_RUNTIME_SCOPE: isolated-staging
      EXPO_PUBLIC_HUSTLE_AUTH_PROVIDER: expo-better-auth
      EXPO_PUBLIC_HUSTLE_AUTH_URL: https://hustle-isolated-staging-api.vercel.app/api/auth
      EXPO_PUBLIC_API_URL: https://hustle-isolated-staging-api.vercel.app/api/v1
      EXPO_PUBLIC_HUSTLE_ENABLE_BOOKING_REQUESTS: 'false'
      EXPO_PUBLIC_HUSTLE_ENABLE_ENQUIRY_MESSAGES: 'true'
      HUSTLE_FINANCIAL_PROVIDERS_ENABLED: 'false'
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install locked monorepo dependencies
        run: npm ci
      - name: Verify connected preview identity, isolation and source contracts
        run: |
          node apps/mobile/scripts/connected-android-apk-contract.cjs
          node apps/mobile/scripts/cloud-preview-config-gate.cjs
          node apps/mobile/scripts/mobile-experience-contract.mjs
          node apps/mobile/scripts/react-singleton-contract.cjs
          npm run typecheck --workspace=@hustle/mobile
      - name: Verify Expo SDK54 Android autolinking
        working-directory: apps/mobile
        shell: bash
        run: |
          npx expo-modules-autolinking resolve --platform android --json > /tmp/hustle-autolink-modules.json
          node scripts/check-native-autolinking.cjs /tmp/hustle-autolink-modules.json
      - name: Bundle connected Android JavaScript
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir /tmp/hustle-connected-android-metro --clear
      - name: Generate isolated Android preview project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean --non-interactive
      - name: Compile standalone internal Android release APK
        working-directory: apps/mobile/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2 --warning-mode=summary
      - name: Verify APK package and record build provenance
        shell: bash
        run: |
          set -euo pipefail
          apk=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          unzip -tq "$apk" >/dev/null
          unzip -Z1 "$apk" > /tmp/hustle-connected-apk-contents.txt
          grep -Eq '^classes([0-9]+)?\.dex
          mkdir -p /tmp/hustle-connected-output
          cp "$apk" /tmp/hustle-connected-output/hustle-connected-staging-internal.apk
          sha256sum /tmp/hustle-connected-output/hustle-connected-staging-internal.apk | tee /tmp/hustle-connected-output/SHA256SUMS.txt
          {
            echo "Source commit: $GITHUB_SHA"
            echo "Mode: connected isolated staging (not offline demo)"
            echo "Identity: com.hustle.economyofyou.preview"
            echo "Distribution: internal Android APK, debug signing material (NOT Play Store)"
            echo "Hosted authentication/device test: NOT VERIFIED by APK compilation"
            echo "Booking/payment providers: DISABLED"
          } > /tmp/hustle-connected-output/BUILD-INFO.txt
          cat /tmp/hustle-connected-output/BUILD-INFO.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload installable internal test APK
        uses: actions/upload-artifact@v4
        with:
          name: hustle-connected-staging-apk-${{ github.sha }}
          path: /tmp/hustle-connected-output/
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
 /tmp/hustle-connected-apk-contents.txt
          grep -Eq '^assets/index\.android\.bundle
          mkdir -p /tmp/hustle-connected-output
          cp "$apk" /tmp/hustle-connected-output/hustle-connected-staging-internal.apk
          sha256sum /tmp/hustle-connected-output/hustle-connected-staging-internal.apk | tee /tmp/hustle-connected-output/SHA256SUMS.txt
          {
            echo "Source commit: $GITHUB_SHA"
            echo "Mode: connected isolated staging (not offline demo)"
            echo "Identity: com.hustle.economyofyou.preview"
            echo "Distribution: internal Android APK, debug signing material (NOT Play Store)"
            echo "Hosted authentication/device test: NOT VERIFIED by APK compilation"
            echo "Booking/payment providers: DISABLED"
          } > /tmp/hustle-connected-output/BUILD-INFO.txt
          cat /tmp/hustle-connected-output/BUILD-INFO.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload installable internal test APK
        uses: actions/upload-artifact@v4
        with:
          name: hustle-connected-staging-apk-${{ github.sha }}
          path: /tmp/hustle-connected-output/
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
 /tmp/hustle-connected-apk-contents.txt
          mkdir -p /tmp/hustle-connected-output
          cp "$apk" /tmp/hustle-connected-output/hustle-connected-staging-internal.apk
          sha256sum /tmp/hustle-connected-output/hustle-connected-staging-internal.apk | tee /tmp/hustle-connected-output/SHA256SUMS.txt
          {
            echo "Source commit: $GITHUB_SHA"
            echo "Mode: connected isolated staging (not offline demo)"
            echo "Identity: com.hustle.economyofyou.preview"
            echo "Distribution: internal Android APK, debug signing material (NOT Play Store)"
            echo "Hosted authentication/device test: NOT VERIFIED by APK compilation"
            echo "Booking/payment providers: DISABLED"
          } > /tmp/hustle-connected-output/BUILD-INFO.txt
          cat /tmp/hustle-connected-output/BUILD-INFO.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload installable internal test APK
        uses: actions/upload-artifact@v4
        with:
          name: hustle-connected-staging-apk-${{ github.sha }}
          path: /tmp/hustle-connected-output/
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
