name: Hustle Saved Native Migration Audit

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type AUDIT_SAVED_MIGRATIONS for read-only comparison of the restored October 20 copy'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hustle-private-native-backup-access
  cancel-in-progress: false

jobs:
  generated-gate:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.confirm == 'AUDIT_SAVED_MIGRATIONS' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify generated reference, drift detection and later migrations without private inputs
        run: python scripts/recovery/native_contract/migration_audit.py

  private-audit:
    needs: generated-gate
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.confirm == 'AUDIT_SAVED_MIGRATIONS' }}
    environment: hustle-cloud-recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install hash-locked authentication dependencies before exposing credentials
        run: python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r scripts/recovery/native_contract/requirements.lock
      - name: Compare the actual saved native schema without applying or resolving migrations
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUNBUFFERED: '1'
          HUSTLE_GENERATED_GATE: passed
          HUSTLE_AUDIT_CONFIRM: ${{ inputs.confirm }}
          HUSTLE_RESTORE_DRIVE_SA_JSON: ${{ secrets.HUSTLE_RESTORE_DRIVE_SA_JSON }}
          HUSTLE_NATIVE_BACKUP_PASSPHRASE: ${{ secrets.HUSTLE_NATIVE_BACKUP_PASSPHRASE }}
        run: python scripts/recovery/native_contract/private_migration_audit.py
      - name: Verify temporary-container cleanup
        if: always()
        run: |
          PYTHONPATH=scripts/recovery/native_contract python -c 'import cloud_contract; cloud_contract.assert_clean()'
      - name: Keep only the bounded schema-comparison result
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hustle-native-migration-audit
          path: ${{ runner.temp }}/hustle-native-migration-audit.json
          if-no-files-found: error
          retention-days: 7
