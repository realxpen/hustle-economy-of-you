name: Isolated Payment Sandbox

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/payment-sandbox.yml"
      - "scripts/payment-sandbox/**"
      - "scripts/experience/staging-*"
      - "scripts/experience/casework-access-check.sql"
      - "apps/api/src/payment/**"
      - "apps/api/src/commerce/**"
      - "apps/api/src/notifications/**"
      - "apps/api/prisma/**"
      - "apps/web/components/finance/**"
      - "apps/web/app/bookings/**"
      - "apps/api/package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  paid-order-lifecycle:
    name: Signed sandbox webhook to completed Order
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: sandbox_only
          POSTGRES_DB: hustle_payment_sandbox
        ports:
          - 127.0.0.1:55439:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hustle_payment_sandbox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:sandbox_only@127.0.0.1:55439/hustle_payment_sandbox?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Syntax-check protected provider runner without running it
        run: node --check scripts/payment-sandbox/real-paystack-test-preflight.mjs
      - name: Validate protected real-provider preflight denies unsafe contexts without network
        run: node scripts/payment-sandbox/check-real-paystack-preflight.mjs
      - name: Validate hosted checkout PREPARE/VERIFY safety guards and syntax without network
        run: |
          node --check scripts/payment-sandbox/hosted-test-checkout.mjs
          node scripts/payment-sandbox/check-hosted-test-checkout-guard.mjs
      - name: Mint throwaway webhook secret
        shell: bash
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "HUSTLE_SANDBOX_WEBHOOK_SECRET=$secret" >> "$GITHUB_ENV"
      - name: Bootstrap Supabase-compatible database roles (isolated local Postgres only)
        shell: bash
        run: |
          PGPASSWORD=sandbox_only psql -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -p 55439 -U postgres -d hustle_payment_sandbox \
            -f scripts/payment-sandbox/supabase-compat.sql
      - name: Mark historical duplicate Story policy migration as already represented
        run: |
          # 20260917124500 already defines these same four Story grants/policies.
          # The later 20260917130500 repeats CREATE POLICY without DROP; do
          # not edit historical migrations or attempt a production repair.
          npx prisma migrate resolve --applied 20260917130500_phase16b_story_rls_hardening --schema=apps/api/prisma/schema.prisma
      - name: Apply all other Hustle migrations to disposable Postgres
        run: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma
      - name: Apply UX009 staging-only booking proposal patch to throwaway Postgres
        shell: bash
        run: |
          set -euo pipefail
          # This runner DB is disposable, local, sandbox_only only.
          # Never apply to Neon parent or append to frozen 41-migration inventory.
          test "${DATABASE_URL%%\?*}" = 'postgresql://postgres:sandbox_only@127.0.0.1:55439/hustle_payment_sandbox'
          PGPASSWORD=sandbox_only psql -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -p 55439 -U postgres -d hustle_payment_sandbox \
            -f infra/staging/schema-patches/20261025_ux009_booking_time_proposal.sql
          PGPASSWORD=sandbox_only psql -v ON_ERROR_STOP=1 -At \
            -h 127.0.0.1 -p 55439 -U postgres -d hustle_payment_sandbox \
            -c "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='public' AND table_name='Booking' AND column_name LIKE 'timeProposal%';" \
            | grep -Fx 7
      - name: Verify FlowTime revision table is API-only (isolated Postgres)
        shell: bash
        run: |
          PGPASSWORD=sandbox_only psql -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -p 55439 -U postgres -d hustle_payment_sandbox \
            -f scripts/experience/flowtime-revision-access-check.sql
      - name: Verify server-only Marketplace casework access (isolated Postgres)
        shell: bash
        run: |
          PGPASSWORD=sandbox_only psql -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -p 55439 -U postgres -d hustle_payment_sandbox \
            -f scripts/experience/casework-access-check.sql
      - name: Build actual Nest API
        run: npm run build --workspace=@hustle/api
      - name: Run end-to-end paid Order and notification assertions
        run: node scripts/payment-sandbox/run.mjs
      - name: Real Nest and disposable PostgreSQL Paystack Product and Booking acceptance (mock provider only)
        env:
          HUSTLE_PAYMENT_GATEWAY: paystack-test
        run: node scripts/payment-sandbox/paystack-order-end-to-end.mjs
