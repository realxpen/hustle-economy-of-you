name: Hustle Paystack Real Test-Mode Provider Preflight (manual, no deployment)

# No provider network calls on PRs, pushes, scheduled triggers or forks.
# A separate protected GitHub environment must supply the sk_test_ key.
on:
  workflow_dispatch:
    inputs:
      approve_test_only:
        description: 'Authorize one Paystack TEST transaction initialization, with NO checkout completion, real funds, deployment or production database'
        required: true
        type: choice
        options:
          - DO_NOT_RUN
          - I_AUTHORIZE_TEST_PROVIDER_INITIALIZE_ONLY
        default: DO_NOT_RUN

permissions:
  contents: read

concurrency:
  group: hustle-paystack-real-test-preflight
  cancel-in-progress: false

jobs:
  paystack-test-api-preflight:
    if: >-
      github.repository == 'realxpen/hustle-economy-of-you' &&
      github.ref == 'refs/heads/main' &&
      inputs.approve_test_only == 'I_AUTHORIZE_TEST_PROVIDER_INITIALIZE_ONLY'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: hustle-paystack-test-preflight
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: sandbox_only
          POSTGRES_DB: hustle_payment_sandbox
        ports:
          - 127.0.0.1:55439:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hustle_payment_sandbox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      NODE_ENV: test
      HUSTLE_PAYMENT_GATEWAY: paystack-test
      PAYSTACK_TEST_PREFLIGHT_CONFIRM: ${{ inputs.approve_test_only }}
      DATABASE_URL: postgresql://postgres:sandbox_only@127.0.0.1:55439/hustle_payment_sandbox?schema=public
      # Private TEST key in protected environment, never checkout or print.
      PAYSTACK_TEST_SECRET_KEY: ${{ secrets.HUSTLE_PAYSTACK_TEST_SECRET_KEY }}
    steps:
      - name: Refuse unapproved branch, repository and event
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'realxpen/hustle-economy-of-you'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
          test "$PAYSTACK_TEST_PREFLIGHT_CONFIRM" = 'I_AUTHORIZE_TEST_PROVIDER_INITIALIZE_ONLY'
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate all test-only and disposable database preconditions before any network access
        run: |
          node --input-type=module -e 'import {assertRealPaystackTestPreflight} from "./scripts/payment-sandbox/real-paystack-preflight-guard.mjs"; assertRealPaystackTestPreflight(process.env); console.log("PASS: exact test-only manual authorization and throwaway local database.");'
      - name: Install locked dependencies
        run: npm ci
      - name: Prepare disposable Postgres compatibility roles
        shell: bash
        run: |
          PGPASSWORD=sandbox_only psql -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -p 55439 -U postgres -d hustle_payment_sandbox \
            -f scripts/payment-sandbox/supabase-compat.sql
      - name: Resolve historical duplicate Story policy on disposable DB only
        run: npx prisma migrate resolve --applied 20260917130500_phase16b_story_rls_hardening --schema=apps/api/prisma/schema.prisma
      - name: Deploy existing Hustle migrations to throwaway Postgres only
        run: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma
      - name: Build existing NestJS payment modules
        run: npm run build --workspace=@hustle/api
      - name: Real Paystack TEST transaction initialization and pending verification (no checkout completion)
        run: node scripts/payment-sandbox/real-paystack-test-preflight.mjs
      - name: State exact test boundary
        run: echo "Paystack TEST initialization only. No payment completed, webhook publicly hosted, deployment, customer funds, or production DB access."
