name: Hustle Isolated Neon Staging Auth Security
on:
  pull_request:
    paths:
      - "apps/api/src/auth/**"
      - "apps/api/src/main.ts"
      - "scripts/staging/neon-jwt-auth-contract.cjs"
      - ".github/workflows/neon-staging-jwt-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny-bad-credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install lockfile dependencies, never external credentials
        run: npm ci
      - name: Verify staging JWKS authentication and rejection paths
        run: node scripts/staging/neon-jwt-auth-contract.cjs
      - name: Verify actual NestJS application TypeScript compiles
        run: npm run typecheck --workspace=@hustle/api
