name: Hustle Foundation CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    # Playwright 1.56.1 cannot install Chromium on runner Ubuntu 26.04.
    # Pin supported LTS image for deterministic no-cost visual smoke tests.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate workflow YAML syntax
        run: node scripts/experience/check-workflow-yaml.cjs
      - name: Responsive UI contract checks
        run: node scripts/responsive/check-contract.cjs
      - name: Core opportunity journey contracts
        run: node scripts/experience/check-opportunity-journey.cjs
      - name: Transaction and conversation UX contracts
        run: node scripts/experience/check-transaction-handoffs.cjs
      - name: Complete Service journey source contracts
        run: node scripts/experience/check-complete-service-journey.cjs
      - name: Booking work-start funding boundary contracts
        run: node scripts/experience/check-booking-payment-gate.cjs
      - name: Authenticated opportunity return and redirect-safety contracts
        run: node scripts/experience/check-auth-opportunity-return.cjs
      - name: Private booking draft continuity and privacy contracts
        run: node scripts/experience/check-booking-draft.cjs
      - name: Consult-first to prepared Booking return contracts
        run: node scripts/experience/check-consultation-booking-return.cjs
      - name: UX023 consultation proof and optional messaging outage policy
        run: node scripts/experience/check-ux023-consultation-booking.cjs
      - name: UX024 unified iPhone Service, Booking and consultation presentation
        run: node scripts/experience/check-ux024-service-experience.cjs
      - name: Hustler response queue and explicit booking decisions
        run: node scripts/experience/check-hustler-booking-response.cjs
      - name: Staging QA safety policy regression (no credentials or external calls)
        run: node scripts/experience/check-staging-acceptance-policy.cjs
      - name: UX009 live 403 diagnostic safety (staging-only, finance-free)
        run: node scripts/experience/check-ux009-live-authorization-probe.cjs
      - name: Creator publishing and Live UX contracts
        run: node scripts/experience/check-creator-experience.cjs
      - name: Verify UX009 shared public-service references and visible seller attribution
        run: node scripts/experience/check-ux009-public-offer-attribution.cjs
      - name: Verify UX009 actionable Client response to Hustler alternate booking time
        run: node scripts/experience/check-ux009-client-booking-time-proposal.cjs
      - name: Release readiness and async privacy contracts
        run: node scripts/experience/check-release-readiness.cjs
      - name: You identity and account UX contracts
        run: node scripts/experience/check-you-account.cjs
      - name: Frictionless navigation and glass UI contracts
        run: node scripts/experience/check-frictionless-glass.cjs
      - name: Verify iOS Home Screen PWA matches Figma/UX004 and remains online-only
        run: node scripts/experience/check-ios-pwa-parity.cjs
      - name: Verify connected iOS staging login, read-only API proxy and CSRF
        run: node scripts/experience/check-ios-pwa-connected-staging.cjs
      - name: "Regression: Explore and Marketplace share the authenticated staging client"
        run: node scripts/experience/check-isolated-search-client.cjs
      - name: UX025 combined marketplace and independent type focus
        run: node scripts/experience/check-ux025-marketplace-focus.cjs
      - name: UX027 founder-selected marketplace gallery and service detail parity
        run: node scripts/experience/check-ux027-marketplace-reference.cjs
      - name: UX028 screenshot-driven iPhone catalogue density and real-data boundaries
        run: node scripts/experience/check-ux028-marketplace-polish.cjs
      - name: UX029 real product gallery Cart and Checkout visual continuity
        run: node scripts/experience/check-ux029-shopping-surface.cjs
      - name: UX030 installed iPhone Discovery header, photo integrity and creator identity
        run: node scripts/experience/check-ux030-discovery-pwa.cjs
      - name: UX031 isolated Product publishing authentication and owner-only staging contract
        run: node scripts/experience/check-ux031-product-staging-auth.cjs
      - name: UX032 isolated Live directory public read and explicit streaming denial
        run: node scripts/experience/check-ux032-live-directory.cjs
      - name: UX033 live preview Discovery integration and nonfinancial Cart staging
        run: node scripts/experience/check-ux033-live-cart.cjs
      - name: UX034 immersive Live room and TikTok-style in-feed attachment experience
        run: node scripts/experience/check-ux034-video-first-live.cjs
      - name: "Regression: isolated Hustler activation and publishing boundaries"
        run: node scripts/experience/check-isolated-hustler-activation.cjs
      - name: Verify UX005 wallet, commented feed and sandbox route boundaries
        run: node scripts/experience/check-ux005-wallet-feed.cjs
      - name: Verify UX006 booking review lifecycle, iPhone proxy, and staging trust boundaries
        run: node scripts/experience/check-ux006-verified-reputation.cjs
      - name: Verify UX007 Activity inbox, review alerts, read receipts and staging proxy guards
        run: node scripts/experience/check-ux007-activity-notifications.cjs
      - name: Verify AWS Lambda isolated staging migration and no Cloudflare cutover
        run: node scripts/experience/check-aws-lambda-staging.cjs
      - name: Verify isolated AWS iPhone Worker, auth host, cookie and fail-closed routing
        run: node scripts/experience/check-cloudflare-aws-preview.cjs
      - name: Verify guarded regular Cloudflare staging AWS cutover and Vercel rollback
        run: node scripts/experience/check-cloudflare-staging-aws-cutover.cjs
      - name: Figma Mobile V1 design consistency contract
        run: node scripts/experience/check-figma-mobile-v1.cjs
      - name: UX011 Figma screens, reusable components and popups
        run: node scripts/experience/check-ux011-screens-sheets.cjs
      - name: UX012 mobile polish and visual capture safety contract
        run: node scripts/experience/check-ux012-visual-contract.cjs
      - name: UX013 synthetic journey and guest-safe browsing contract
        run: node scripts/experience/check-ux013-journey-policy.cjs
      - name: UX015 Figma feed and Inbox visual hierarchy contract
        run: node scripts/experience/check-ux015-figma-fidelity.cjs
      - name: UX019 Figma Explore, live suggestions and nearby truth contract
        run: node scripts/experience/check-ux019-explore-discovery.cjs
      - name: UX021 search result identity, media and commerce layout contract
        run: node scripts/experience/check-ux021-search-visual-results.cjs
      - run: npm run typecheck --workspace=@hustle/web
      - run: npm run typecheck --workspace=@hustle/admin
      - run: npm run typecheck --workspace=@hustle/mobile
      - run: npm run prisma:generate --workspace=@hustle/api
      - name: UX020 all-four-type search and creator handle regression (in-memory only)
        run: node scripts/experience/check-ux020-cross-type-search.cjs
      - run: npm run typecheck --workspace=@hustle/api
      - run: npm run build --workspace=@hustle/web
      - run: npm run build --workspace=@hustle/admin
      - run: npm run build --workspace=@hustle/api
      - name: UX010 real Client/Hustler creator opportunity and privacy service regression
        run: node scripts/experience/check-ux010-creator-activation.cjs
      - name: UX011 local signed object store and private iPhone media lifecycle
        run: node scripts/experience/check-ux011-media-lifecycle.cjs
      - name: UX011 read-only orphan inventory and fail-closed cleanup audit
        run: node scripts/experience/check-ux011-orphan-audit.cjs
      - name: UX011 Safari-to-S3 upload failure diagnostics and safe signed retry
        run: node scripts/experience/check-ux011-browser-transfer-recovery.cjs
      - name: Exercise real Nest Client/Hustler alternate-time consent state machine
        run: node scripts/experience/check-ux009-time-consent-runtime.cjs
      - name: FlowTime adaptive scheduling and capacity safety regression
        run: node scripts/experience/check-flowtime.cjs
      - name: Install Chromium for isolated local Web UI smoke
        run: |
          npm install --prefix /tmp/hustle-smoke --no-save --no-package-lock playwright@1.56.1
          /tmp/hustle-smoke/node_modules/.bin/playwright install --with-deps chromium
      - name: Launch locally built Web (no external transaction access)
        shell: bash
        run: |
          npm run start --workspace=@hustle/web > /tmp/hustle-web-start.log 2>&1 &
          echo $! > /tmp/hustle-web-start.pid
          for i in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3001/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/hustle-web-start.log
          exit 1
      - name: Smoke test local Web at 320–1440 CSS pixels
        env:
          NODE_PATH: /tmp/hustle-smoke/node_modules
          HUSTLE_SMOKE_REPORT_PATH: /tmp/hustle-local-web-smoke.json
        run: node scripts/responsive/local-smoke.cjs
      - name: Smoke test installed iPhone PWA interface and icon routes
        env:
          NODE_PATH: /tmp/hustle-smoke/node_modules
        run: node scripts/responsive/pwa-standalone-smoke.cjs
      - name: Interactive local Service to Booking UI regression
        env:
          NODE_PATH: /tmp/hustle-smoke/node_modules
        run: node scripts/experience/local-service-interaction.cjs
      - name: UX013 test guest Feed and Explore → offer popup → intent (synthetic only)
        env:
          NODE_PATH: /tmp/hustle-smoke/node_modules
          HUSTLE_UX013_ARTIFACT_DIR: /tmp/hustle-ux013-journey-qa
        run: node scripts/experience/local-ux013-journeys.cjs
      - name: UX012 capture unauthenticated Figma review screenshots
        env:
          NODE_PATH: /tmp/hustle-smoke/node_modules
          HUSTLE_VISUAL_REVIEW_DIR: /tmp/hustle-ux012-visual-review
        run: node scripts/responsive/capture-figma-review.cjs
      - name: Upload local UI smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-web-responsive-smoke
          path: /tmp/hustle-local-web-smoke.json
          if-no-files-found: ignore
      - name: Upload UX012 screenshot review pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hustle-ux012-figma-visual-review
          path: /tmp/hustle-ux012-visual-review/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload UX013 synthetic user-journey screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hustle-ux013-journey-evidence
          path: /tmp/hustle-ux013-journey-qa/
          if-no-files-found: ignore
          retention-days: 7

