name: Hustle Foundation CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - run: npm run typecheck --workspace=@hustle/web
      - run: npm run typecheck --workspace=@hustle/admin
      - run: npm run typecheck --workspace=@hustle/mobile
      - run: npm run prisma:generate --workspace=@hustle/api
      - run: npm run typecheck --workspace=@hustle/api
      - run: npm run build --workspace=@hustle/web
      - run: npm run build --workspace=@hustle/admin
      - run: npm run build --workspace=@hustle/api
      - name: Commit generated npm lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- package-lock.json || [ -n "$(git ls-files --others --exclude-standard package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: lock Phase 2 dependencies"
            git push
          fi
