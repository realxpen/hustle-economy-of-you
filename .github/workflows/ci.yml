name: Hustle Foundation CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    # Playwright 1.56.1 cannot install Chromium on runner Ubuntu 26.04.
    # Pin supported LTS image for deterministic no-cost visual smoke tests.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate workflow YAML syntax
        run: node scripts/experience/check-workflow-yaml.cjs
      - name: Responsive UI contract checks
        run: node scripts/responsive/check-contract.cjs
      - name: Core opportunity journey contracts
        run: node scripts/experience/check-opportunity-journey.cjs
      - name: Transaction and conversation UX contracts
        run: node scripts/experience/check-transaction-handoffs.cjs
      - name: Complete Service journey source contracts
        run: node scripts/experience/check-complete-service-journey.cjs
      - name: Booking work-start funding boundary contracts
        run: node scripts/experience/check-booking-payment-gate.cjs
      - name: Authenticated opportunity return and redirect-safety contracts
        run: node scripts/experience/check-auth-opportunity-return.cjs
      - name: Private booking draft continuity and privacy contracts
        run: node scripts/experience/check-booking-draft.cjs
      - name: Consult-first to prepared Booking return contracts
        run: node scripts/experience/check-consultation-booking-return.cjs
      - name: Hustler response queue and explicit booking decisions
        run: node scripts/experience/check-hustler-booking-response.cjs
      - name: Staging QA safety policy regression (no credentials or external calls)
        run: node scripts/experience/check-staging-acceptance-policy.cjs
      - name: Creator publishing and Live UX contracts
        run: node scripts/experience/check-creator-experience.cjs
      - name: Release readiness and async privacy contracts
        run: node scripts/experience/check-release-readiness.cjs
      - name: You identity and account UX contracts
        run: node scripts/experience/check-you-account.cjs
      - name: Frictionless navigation and glass UI contracts
        run: node scripts/experience/check-frictionless-glass.cjs
      - name: Verify iOS Home Screen PWA matches Figma/UX004 and remains online-only
        run: node scripts/experience/check-ios-pwa-parity.cjs
      - run: npm run typecheck --workspace=@hustle/web
      - run: npm run typecheck --workspace=@hustle/admin
      - run: npm run typecheck --workspace=@hustle/mobile
      - run: npm run prisma:generate --workspace=@hustle/api
      - run: npm run typecheck --workspace=@hustle/api
      - run: npm run build --workspace=@hustle/web
      - run: npm run build --workspace=@hustle/admin
      - run: npm run build --workspace=@hustle/api
      - name: FlowTime adaptive scheduling and capacity safety regression
        run: node scripts/experience/check-flowtime.cjs
      - name: Install Chromium for isolated local Web UI smoke
        run: |
          npm install --prefix /tmp/hustle-smoke --no-save --no-package-lock playwright@1.56.1
          /tmp/hustle-smoke/node_modules/.bin/playwright install --with-deps chromium
      - name: Launch locally built Web (no external transaction access)
        shell: bash
        run: |
          npm run start --workspace=@hustle/web > /tmp/hustle-web-start.log 2>&1 &
          echo $! > /tmp/hustle-web-start.pid
          for i in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3001/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/hustle-web-start.log
          exit 1
      - name: Smoke test local Web at 320–1440 CSS pixels
        env:
          NODE_PATH: /tmp/hustle-smoke/node_modules
          HUSTLE_SMOKE_REPORT_PATH: /tmp/hustle-local-web-smoke.json
        run: node scripts/responsive/local-smoke.cjs
      - name: Interactive local Service to Booking UI regression
        env:
          NODE_PATH: /tmp/hustle-smoke/node_modules
        run: node scripts/experience/local-service-interaction.cjs
      - name: Upload local UI smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-web-responsive-smoke
          path: /tmp/hustle-local-web-smoke.json
          if-no-files-found: ignore

