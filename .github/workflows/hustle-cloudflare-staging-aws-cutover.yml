name: Hustle Cloudflare Regular Staging AWS Cutover (manual only)

on:
  workflow_dispatch:
    inputs:
      approve_cutover:
        description: 'Switch ONLY the existing nonproduction staging iPhone Worker from Vercel to isolated AWS after UX009 sign-off'
        required: true
        type: choice
        options:
          - DO_NOT_DEPLOY
          - I_AUTHORIZE_AWS_STAGING_CUTOVER_ONLY
        default: DO_NOT_DEPLOY

permissions:
  contents: read

# Shares the original staging deploy concurrency group for safe rollback.
concurrency:
  group: hustle-cloudflare-isolated-staging
  cancel-in-progress: false

jobs:
  deploy-reviewed-staging-cutover:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.repository == 'realxpen/hustle-economy-of-you' &&
      inputs.approve_cutover == 'I_AUTHORIZE_AWS_STAGING_CUTOVER_ONLY'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: hustle-cloudflare-staging
    env:
      CI: 'true'
      HUSTLE_AWS_PREVIEW_BUILD: 'false'
      HUSTLE_STAGING_AWS_CUTOVER_BUILD: 'true'
      HUSTLE_API_BACKEND_TARGET: aws-lambda-isolated-staging
      NEXT_PUBLIC_HUSTLE_AWS_PREVIEW: 'false'
      HUSTLE_ISOLATED_PWA_GATE: isolated-staging
      NEXT_PUBLIC_HUSTLE_WEB_STAGING_AUTH: 'true'
      AWS_LAMBDA_ORIGIN: https://hh2zi77ntrsjj3rgapko7rsjv40ztgpu.lambda-url.eu-west-2.on.aws
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify exact isolated staging release intent
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "realxpen/hustle-economy-of-you"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$HUSTLE_AWS_PREVIEW_BUILD" = "false"
          test "$HUSTLE_STAGING_AWS_CUTOVER_BUILD" = "true"
          test "$HUSTLE_API_BACKEND_TARGET" = "aws-lambda-isolated-staging"
          test "$NEXT_PUBLIC_HUSTLE_AWS_PREVIEW" = "false"
          test "$HUSTLE_ISOLATED_PWA_GATE" = "isolated-staging"
      - name: Require healthy Lambda and blocked real payments
        run: |
          set -euo pipefail
          HEALTH="$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' "$AWS_LAMBDA_ORIGIN/api/v1/health")"
          test "$HEALTH" = "200"
          AUTH_DENIED="$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' "$AWS_LAMBDA_ORIGIN/api/v1/notifications")"
          test "$AUTH_DENIED" = "401"
          PAYMENT_DENIED="$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{}' "$AWS_LAMBDA_ORIGIN/api/v1/payments/initialize")"
          test "$PAYMENT_DENIED" = "403"
      - name: Check staging cutover and existing independent Worker contracts
        run: |
          set -euo pipefail
          npm ci --include=dev
          npm ls vite-css-modules vite typescript --workspace=@hustle/web --depth=0
          node scripts/experience/check-workflow-yaml.cjs
          node scripts/cloudflare/check-worker-config.cjs
          HUSTLE_STAGING_AWS_CUTOVER_BUILD=false node scripts/experience/check-cloudflare-aws-preview.cjs
          node scripts/experience/check-cloudflare-staging-aws-cutover.cjs
          node scripts/experience/check-ios-pwa-parity.cjs
          node scripts/experience/check-ios-pwa-connected-staging.cjs
          npm run typecheck --workspace=@hustle/web
      - name: Compile regular staging iPhone Worker to pinned AWS API
        env:
          NODE_ENV: production
        run: npm run build:vinext --workspace=@hustle/web
      - name: Deploy only the existing regular nonproduction staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "$HUSTLE_STAGING_AWS_CUTOVER_BUILD" = "true"
          test "$HUSTLE_AWS_PREVIEW_BUILD" = "false"
          npm run deploy:vinext --workspace=@hustle/web
      - name: Read-only normal staging smoke test
        run: |
          set -euo pipefail
          HOST="https://hustle-ios-pwa-staging.realxpens.workers.dev"
          # The regular invited-login page renders PRIVATE TEST; only the
          # separate preview page renders the uppercase AWS TEST banner.
          # The former 'grep -q HUSTLE' was a false-negative after deploy.
          # Check actual HTTP statuses and retry briefly for Worker propagation.
          confirmed=false
          for attempt in 1 2 3 4 5; do
            AUTH_STATUS="$(curl -sS --max-time 25 -o /tmp/hustle-cutover-auth.html -w '%{http_code}' "$HOST/auth" || true)"
            HEALTH_STATUS="$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' "$HOST/api/isolated/api/v1/health" || true)"
            DENIED_STATUS="$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' "$HOST/api/isolated/api/v1/notifications" || true)"
            if test "$AUTH_STATUS" = "200" &&
               grep -q 'PRIVATE TEST' /tmp/hustle-cutover-auth.html &&
               ! grep -q 'HUSTLE · AWS TEST' /tmp/hustle-cutover-auth.html &&
               test "$HEALTH_STATUS" = "200" &&
               test "$DENIED_STATUS" = "401"; then
              confirmed=true
              break
            fi
            echo "Regular staging smoke attempt $attempt/5: auth=$AUTH_STATUS health=$HEALTH_STATUS unauthenticated_notifications=$DENIED_STATUS"
            if test "$attempt" != "5"; then sleep 3; fi
          done
          if test "$confirmed" != "true"; then
            echo "::error::Normal staging smoke failed; validate HTTP statuses, login-page identity and AWS routing before acceptance. Vercel rollback workflow remains available."
            exit 1
          fi
          echo 'PASS: nonproduction staging Worker serves invited sign-in, healthy API and guest notification denial. Complete authenticated device smoke before closing UX009.'
