name: Hustle Dedicated Paystack TEST Secret Setup (manual only)

on:
  workflow_dispatch:
    inputs:
      approve_secret_setup:
        description: 'I authorize updates to ONLY the isolated AWS TEST secret, not public deployment'
        required: true
        type: choice
        options:
          - DO_NOT_CONFIGURE
          - I_AUTHORIZE_TEST_ONLY_SECRET_SETUP
        default: DO_NOT_CONFIGURE
      phase:
        description: 'PREPARE DB/Auth with Paystack disabled; FINALIZE only after PG17 schema and test key'
        required: true
        type: choice
        options:
          - PREPARE_DATABASE_AND_AUTH
          - FINALIZE_TEST_ONLY
        default: PREPARE_DATABASE_AND_AUTH

permissions:
  contents: read
  id-token: write

concurrency:
  group: hustle-payment-preview-secret-setup
  cancel-in-progress: false

jobs:
  isolated-secret-only:
    if: >-
      github.repository == 'realxpen/hustle-economy-of-you' &&
      github.ref == 'refs/heads/main' &&
      inputs.approve_secret_setup == 'I_AUTHORIZE_TEST_ONLY_SECRET_SETUP'
    environment: hustle-payment-preview-api
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      HUSTLE_PREVIEW_SECRET_APPROVAL: ${{ inputs.approve_secret_setup }}
      HUSTLE_PREVIEW_SECRET_PHASE: ${{ inputs.phase }}
      HUSTLE_NEON_PROJECT_ID: fragrant-field-59689896
      HUSTLE_NEON_BRANCH_ID: br-curly-leaf-zat0ec8m
      HUSTLE_PREVIEW_NEON_API_URL: ${{ secrets.HUSTLE_PREVIEW_NEON_API_URL }}
      HUSTLE_PREVIEW_PAYSTACK_TEST_KEY: ${{ secrets.HUSTLE_PREVIEW_PAYSTACK_TEST_KEY }}
      HUSTLE_PREVIEW_TEST_EMAILS: ${{ vars.HUSTLE_PREVIEW_TEST_EMAILS }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refuse missing protected database URL or non-test authorization before AWS access
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'realxpen/hustle-economy-of-you'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$HUSTLE_NEON_PROJECT_ID" = fragrant-field-59689896
          test "$HUSTLE_NEON_BRANCH_ID" = br-curly-leaf-zat0ec8m
          test "$HUSTLE_PREVIEW_SECRET_APPROVAL" = I_AUTHORIZE_TEST_ONLY_SECRET_SETUP
          test -n "$HUSTLE_PREVIEW_NEON_API_URL" || { echo "::error::Add the new dedicated Neon API runtime URL to the GitHub protected environment secret; no changes made"; exit 1; }
          node --input-type=module -e '
            import {normalizedPreviewRuntimeUrls} from "./scripts/payment-preview/configure-aws-secret.mjs";
            normalizedPreviewRuntimeUrls(process.env.HUSTLE_PREVIEW_NEON_API_URL);
            console.log("PASS: TEST-only Neon runtime role, host and SSL; connection credentials never printed");
          '
          node scripts/payment-preview/check-aws-secret-guard.mjs
          if test "$HUSTLE_PREVIEW_SECRET_PHASE" = FINALIZE_TEST_ONLY; then
            test -n "$HUSTLE_PREVIEW_PAYSTACK_TEST_KEY" || { echo "::error::Only a protected sk_test key can finalize TEST setup"; exit 1; }
            test -n "$HUSTLE_PREVIEW_TEST_EMAILS" || { echo "::error::Private invited test email allowlist missing"; exit 1; }
          fi
      - name: Assume ONLY the dedicated preview AWS deployment role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::707859598737:role/hustle-github-payment-preview-deployer
          aws-region: eu-west-2
          role-session-name: hustle-preview-secret-setup
      - name: Install PostgreSQL client only when finalizing
        if: inputs.phase == 'FINALIZE_TEST_ONLY'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Update ONLY dedicated AWS Secrets Manager record using private temp file
        shell: bash
        run: |
          set -euo pipefail
          node scripts/payment-preview/configure-aws-secret.mjs
      - name: Confirm test-only status without revealing any secret values
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(aws secretsmanager describe-secret --region eu-west-2 --secret-id hustle-payment-preview-credentials --query "Tags[?Key=='status'].Value | [0]" --output text)"
          if test "$HUSTLE_PREVIEW_SECRET_PHASE" = FINALIZE_TEST_ONLY; then
            test "$STATUS" = configured-test-only
          else
            test "$STATUS" = not-configured
          fi
          echo "PASS: isolated preview AWS secret phase completed. No Lambda, Cloudflare Worker, checkout, or Paystack dashboard mutation."
