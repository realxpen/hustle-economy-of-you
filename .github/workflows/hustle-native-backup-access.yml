name: Hustle Private Native Backup Access Check

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type VERIFY_NATIVE_BACKUP to test the saved October 20 copy'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hustle-private-native-backup-access
  cancel-in-progress: false

jobs:
  generated-gate:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.confirm == 'VERIFY_NATIVE_BACKUP' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify generated recovery and private-copy adapter without any secrets
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          python scripts/recovery/native_contract/cloud_contract.py
          python scripts/recovery/native_contract/private_fixture.py

  private-access:
    needs: generated-gate
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.confirm == 'VERIFY_NATIVE_BACKUP' }}
    environment: hustle-cloud-recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install the hash-locked Google authentication dependency before exposing credentials
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r scripts/recovery/native_contract/requirements.lock
      - name: Verify the exact private backup in a temporary offline copy
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUNBUFFERED: '1'
          HUSTLE_GENERATED_GATE: passed
          HUSTLE_NATIVE_CONFIRM: ${{ inputs.confirm }}
          HUSTLE_RESTORE_DRIVE_SA_JSON: ${{ secrets.HUSTLE_RESTORE_DRIVE_SA_JSON }}
          HUSTLE_NATIVE_BACKUP_PASSPHRASE: ${{ secrets.HUSTLE_NATIVE_BACKUP_PASSPHRASE }}
          HUSTLE_RECOVERY_OWNER_EMAIL: ${{ secrets.HUSTLE_RECOVERY_OWNER_EMAIL }}
          HUSTLE_RECOVERY_OWNER_PASSWORD: ${{ secrets.HUSTLE_RECOVERY_OWNER_PASSWORD }}
        run: python scripts/recovery/native_contract/private_cloud.py
      - name: Verify recovery container cleanup
        if: always()
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          path = Path('scripts/recovery/native_contract/cloud_contract.py')
          spec = importlib.util.spec_from_file_location('cleanup_check', path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.assert_clean()
          PY
      - name: Keep the aggregate result only
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hustle-native-access-result
          path: ${{ runner.temp }}/hustle-native-access-result.json
          if-no-files-found: error
          retention-days: 7
