name: Hustle Neon-Compatible Prisma Projection (Isolated PG17)

# Tests application-only historical Prisma migrations on throwaway PostgreSQL.
# Never supplies Neon/Supabase/Vercel credentials or writes to hosted accounts.
on:
  pull_request:
    paths:
      - "scripts/staging/neon-prisma-projection.cjs"
      - "scripts/staging/neon-projection-contract.cjs"
      - "scripts/staging/neon-child-branch-approval-contract.cjs"
      - ".github/workflows/hustle-neon-prisma-projection.yml"
      - "apps/api/prisma/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  neon-application-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: projection_ci_only
          POSTGRES_DB: hustle_neon_projection
        ports:
          - 127.0.0.1:55441:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hustle_neon_projection"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:projection_ci_only@127.0.0.1:55441/hustle_neon_projection?schema=public
      PGHOST: 127.0.0.1
      PGPORT: "55441"
      PGUSER: postgres
      PGDATABASE: hustle_neon_projection
      PGPASSWORD: projection_ci_only
      EXPO_PUBLIC_HUSTLE_ENABLE_BOOKING_REQUESTS: "false"
      HUSTLE_FINANCIAL_PROVIDERS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Confirm disposable localhost boundary and source manifest
        run: node scripts/staging/neon-projection-contract.cjs preflight
      - name: Install locked dependencies
        run: npm ci
      - name: Create only two fictional managed-auth tables; no Supabase fixtures
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA neon_auth;
          CREATE TABLE neon_auth."user" (id text PRIMARY KEY, email text);
          CREATE TABLE neon_auth.jwks (id text PRIMARY KEY);
          INSERT INTO neon_auth."user" (id, email) VALUES ('fictional-one', 'fake@example.invalid');
          SQL
          pg_dump --schema-only --schema=neon_auth | sed '/^\\restrict /d; /^\\unrestrict /d' > /tmp/staged-neon-auth-before.sql
      - name: Project all 41 original migrations into separate temporary schema path
        run: node scripts/staging/neon-prisma-projection.cjs /tmp/hustle-neon-application-projection
      - name: Audit immutable migration hashes and destructive SQL before ANY future hosted branch application
        run: node scripts/staging/neon-child-branch-approval-contract.cjs
      - name: Deploy projected migrations exclusively to disposable PG17
        run: npx prisma migrate deploy --schema=/tmp/hustle-neon-application-projection/schema.prisma
      - name: Verify public app tables, history, roles and unchanged auth fixture
        shell: bash
        run: |
          node scripts/staging/neon-projection-contract.cjs verify
          pg_dump --schema-only --schema=neon_auth | sed '/^\\restrict /d; /^\\unrestrict /d' > /tmp/staged-neon-auth-after.sql
          diff -u /tmp/staged-neon-auth-before.sql /tmp/staged-neon-auth-after.sql
          psql -v ON_ERROR_STOP=1 -Atqc 'SELECT count(*) FROM neon_auth."user"' | grep -x 1
          if psql -v ON_ERROR_STOP=1 -Atqc 'SELECT count(*) FROM storage.objects' > /tmp/forbidden-storage-test 2>&1; then
            echo "::error::Supabase Storage should not be present in isolated Neon schema"
            exit 1
          fi
      - name: Report boundaries
        run: echo "PASS staging-only projection on local PostgreSQL 17; hosted Neon and production untouched"
