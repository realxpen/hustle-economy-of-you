
name: Hustle Manual Production Deployment

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Select the Hustle project to deploy"
        required: true
        type: choice
        options:
          - api
          - web
          - admin
      confirm:
        description: "Type DEPLOY to authorize deployment"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: hustle-production-release
      cancel-in-progress: false

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}

    steps:
      - name: Checkout approved main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select Vercel project
        shell: bash
        run: |
          case "${{ inputs.project }}" in
            api)
              echo "VERCEL_PROJECT_ID=${{ vars.VERCEL_API_PROJECT_ID }}" >> "$GITHUB_ENV"
              ;;
            web)
              echo "VERCEL_PROJECT_ID=${{ vars.VERCEL_WEB_PROJECT_ID }}" >> "$GITHUB_ENV"
              ;;
            admin)
              echo "VERCEL_PROJECT_ID=${{ vars.VERCEL_ADMIN_PROJECT_ID }}" >> "$GITHUB_ENV"
              ;;
            *)
              exit 1
              ;;
          esac

      - name: Check deployment credentials
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"

      - name: Validate Hustle
        run: |
          npm ci
          npm run prisma:generate --workspace=@hustle/api
          npm run ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Load production project settings
        run: vercel pull --yes --environment=production

      - name: Deploy selected project
        run: vercel deploy --prod --yes
