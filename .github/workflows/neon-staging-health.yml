name: Hustle Free Staging Health and Isolation Contracts
on:
  pull_request:
    paths:
      - "infra/neon/staging/**"
      - "scripts/staging/neon-health-contract.mjs"
      - "scripts/staging/neon-isolation-config-contract.mjs"
      - ".github/workflows/neon-staging-health.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-health-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify isolated public hosting readiness reports no auth or API acceptance
        run: node scripts/staging/neon-health-contract.mjs
      - name: Refuse wrong database, Supabase auth or financial provider flags
        run: node scripts/staging/neon-isolation-config-contract.mjs
