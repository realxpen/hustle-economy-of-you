name: Hustle Real Paystack TEST Webhook Delivery (manual temporary tunnel)

# Public test endpoint is created ONLY by a protected, explicitly approved
# manual run on main. Never on PR/push/schedule, never any Hustle staging/production.
on:
  workflow_dispatch:
    inputs:
      approve_test_webhook:
        description: 'I approve a temporary public TEST-only webhook, two disposable Paystack TEST checkouts and changing only the TEST dashboard webhook URL'
        required: true
        type: choice
        options:
          - DO_NOT_RUN
          - I_AUTHORIZE_TEMPORARY_TEST_WEBHOOK_ONLY
        default: DO_NOT_RUN

permissions:
  contents: read

concurrency:
  group: hustle-paystack-real-test-webhook
  cancel-in-progress: false

jobs:
  provider-delivery:
    if: >-
      github.repository == 'realxpen/hustle-economy-of-you' &&
      github.ref == 'refs/heads/main' &&
      inputs.approve_test_webhook == 'I_AUTHORIZE_TEMPORARY_TEST_WEBHOOK_ONLY'
    runs-on: ubuntu-latest
    timeout-minutes: 42
    environment: hustle-paystack-test-preflight
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: sandbox_only
          POSTGRES_DB: hustle_payment_sandbox
        ports:
          - 127.0.0.1:55439:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hustle_payment_sandbox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      NODE_ENV: test
      HUSTLE_PAYMENT_GATEWAY: paystack-test
      HUSTLE_TEST_WEBHOOK_APPROVAL: ${{ inputs.approve_test_webhook }}
      HUSTLE_TEST_WEBHOOK_TUNNEL: quick-tunnel
      HUSTLE_TEST_WEBHOOK_PHASE: RECEIVE
      DATABASE_URL: postgresql://postgres:sandbox_only@127.0.0.1:55439/hustle_payment_sandbox?schema=public
      PAYSTACK_TEST_SECRET_KEY: ${{ secrets.HUSTLE_PAYSTACK_TEST_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify isolated test-only manual approval before provider or tunnel access
        run: |
          node --input-type=module -e 'import {assertRealPaystackWebhookEnvironment} from "./scripts/payment-sandbox/real-paystack-webhook-guard.mjs"; assertRealPaystackWebhookEnvironment(process.env); console.log("PASS: authorized protected main-only test webhook, local DB and private TEST key");'
      - name: Install locked dependencies and verify isolated webhook guard
        run: |
          npm ci
          node scripts/payment-sandbox/check-real-paystack-webhook-receiver.mjs
      - name: Initialize disposable PostgreSQL compatibility roles
        shell: bash
        run: |
          PGPASSWORD=sandbox_only psql -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -p 55439 -U postgres -d hustle_payment_sandbox \
            -f scripts/payment-sandbox/supabase-compat.sql
      - name: Resolve known duplicate Story policy in throwaway DB only
        run: npx prisma migrate resolve --applied 20260917130500_phase16b_story_rls_hardening --schema=apps/api/prisma/schema.prisma
      - name: Apply actual Hustle migrations to throwaway DB only
        run: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma
      - name: Apply disposable-only booking proposal compatibility fields
        shell: bash
        run: |
          PGPASSWORD=sandbox_only psql -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -p 55439 -U postgres -d hustle_payment_sandbox \
            -f infra/staging/schema-patches/20261025_ux009_booking_time_proposal.sql
      - name: Build existing NestJS backend (no public application server)
        run: npm run build --workspace=@hustle/api
      - name: Pull pinned Cloudflare development-only tunnel image
        run: docker pull cloudflare/cloudflared:2026.10.7
      - name: Real Paystack TEST provider-delivered Order and Booking webhook acceptance
        run: node scripts/payment-sandbox/real-paystack-webhook-acceptance.mjs
      - name: Confirm no deploy or production access
        run: echo "Temporary webhook-only test tunnel terminated. Disposable DB only; NO real funds, production DB or application deployment."
