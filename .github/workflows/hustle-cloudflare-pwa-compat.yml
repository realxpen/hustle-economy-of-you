name: Hustle Cloudflare PWA Compatibility (no deployment)

on:
  pull_request:
    paths:
      - apps/web/**
      - package.json
      - package-lock.json
      - .github/workflows/hustle-cloudflare-pwa-compat.yml
      - .github/workflows/hustle-cloudflare-staging-deploy.yml
      - .github/workflows/hustle-cloudflare-staging-aws-cutover.yml
      - .github/workflows/hustle-cloudflare-aws-preview.yml
      - .github/workflows/hustle-payment-preview-web-deploy.yml
      - scripts/payment-sandbox/check-payment-preview-worker-config.cjs
      - scripts/experience/check-cloudflare-aws-preview.cjs
      - scripts/experience/check-cloudflare-staging-aws-cutover.cjs
      - scripts/cloudflare/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 'true'
      HUSTLE_ISOLATED_PWA_GATE: isolated-staging
      NEXT_PUBLIC_HUSTLE_WEB_STAGING_AUTH: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pinned and reproducible Cloudflare/Next dependencies
        run: npm ci
      - name: Official vinext compatibility scan
        working-directory: apps/web
        run: npx vinext check
      - name: Verify Cloudflare Worker preview identity and strict auth boundaries
        run: |
          node scripts/cloudflare/check-worker-config.cjs
          node scripts/payment-sandbox/check-payment-preview-worker-config.cjs
          node scripts/payment-sandbox/check-payment-preview-web-proxy.cjs
          node scripts/experience/check-cloudflare-aws-preview.cjs
          node scripts/experience/check-ios-pwa-parity.cjs
          node scripts/experience/check-ios-pwa-connected-staging.cjs
          node scripts/experience/check-isolated-search-client.cjs
          node scripts/experience/check-isolated-hustler-activation.cjs
          npm run typecheck --workspace=@hustle/web
      - name: Compile pinned Cloudflare Worker for iPhone PWA
        run: npm run build:vinext --workspace=@hustle/web
      - name: Smoke live local workerd preview without external credentials
        run: |
          npm run start:vinext --workspace=@hustle/web -- --host 127.0.0.1 --port 4173 > /tmp/hustle-cf-preview.log 2>&1 &
          process_id=$!
          trap 'kill $process_id 2>/dev/null || true' EXIT
          for attempt in $(seq 1 35); do
            if curl -fsS --max-time 5 http://127.0.0.1:4173/manifest.webmanifest -o /tmp/hustle-cf-manifest.json; then break; fi
            sleep 2
          done
          node -e 'const m=require("/tmp/hustle-cf-manifest.json"); if(m.start_url!=="/home"||m.display!=="standalone") process.exit(1)'
          curl -fsS --max-time 20 http://127.0.0.1:4173/auth -o /tmp/hustle-cf-auth.html
          grep -q 'PRIVATE TEST' /tmp/hustle-cf-auth.html
          curl -fsS --max-time 20 http://127.0.0.1:4173/home -o /dev/null
          curl -fsS --max-time 20 http://127.0.0.1:4173/search -o /dev/null
          echo 'PASS: local Cloudflare Worker serves install manifest, invited login, Home and Explore.'
      - name: Exercise AWS preview static manifest in local Cloudflare Worker before release
        env:
          HUSTLE_AWS_PREVIEW_BUILD: 'true'
          NEXT_PUBLIC_HUSTLE_AWS_PREVIEW: 'true'
          HUSTLE_API_BACKEND_TARGET: aws-lambda-isolated-staging
        run: |
          set -euo pipefail
          npm run build:vinext --workspace=@hustle/web
          test -f apps/web/.cloudflare/output/v0/workers/default/assets/aws-test.webmanifest
          npm run start:vinext --workspace=@hustle/web -- --host 127.0.0.1 --port 4175 > /tmp/hustle-aws-preview-smoke.log 2>&1 &
          process_id=$!
          trap 'kill $process_id 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 http://127.0.0.1:4175/aws-test.webmanifest -o /tmp/hustle-aws-preview-test-manifest.json; then break; fi
            sleep 2
          done
          node -e 'const fs=require("fs");const m=JSON.parse(fs.readFileSync("/tmp/hustle-aws-preview-test-manifest.json","utf8")); console.log("AWS manifest (public metadata only):",JSON.stringify({name:m.name,id:m.id,display:m.display,start_url:m.start_url})); if(m.name!=="Hustle AWS Test — The Economy of You"||m.id!=="/aws-test"||m.display!=="standalone")process.exit(1)'
          curl -fsS --max-time 20 http://127.0.0.1:4175/auth -o /tmp/hustle-aws-preview-test-auth.html
          grep -q 'aws-test.webmanifest' /tmp/hustle-aws-preview-test-auth.html
          echo 'PASS: AWS-only compiled Worker serves its static iPhone manifest and separate login UI, with no public deployment.'
      - name: Compile independent payment-preview PWA without provider credentials or public deployment
        env:
          HUSTLE_PAYMENT_PREVIEW_BUILD: 'true'
          HUSTLE_API_BACKEND_TARGET: payment-preview
          HUSTLE_ISOLATED_PWA_GATE: payment-preview
          NEXT_PUBLIC_HUSTLE_WEB_STAGING_AUTH: 'true'
          HUSTLE_PAYMENT_PREVIEW_API_ORIGIN: https://hustle-payment-preview-api.realxpens.workers.dev
        shell: bash
        run: |
          set -euo pipefail
          node scripts/payment-sandbox/check-payment-preview-worker-config.cjs
          npm run build:vinext --workspace=@hustle/web
          test -d apps/web/.cloudflare/output
          npm run start:vinext --workspace=@hustle/web -- --host 127.0.0.1 --port 4177 > /tmp/hustle-payment-preview-smoke.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 http://127.0.0.1:4177/auth -o /tmp/hustle-payment-preview-auth.html; then break; fi
            sleep 2
          done
          grep -q 'PRIVATE TEST' /tmp/hustle-payment-preview-auth.html
          echo 'PASS: dedicated payment-preview Worker builds and serves private test login in isolated local workerd; no deploy or Paystack.'
      - name: Upload diagnostics only on failure (no provider secrets)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hustle-cloudflare-build-diagnostics
          retention-days: 4
          if-no-files-found: ignore
          path: /tmp/hustle-cf-preview.log
