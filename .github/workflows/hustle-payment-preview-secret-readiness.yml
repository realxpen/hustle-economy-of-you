name: Hustle TEST Payment Preview Credential Readiness (read-only)

on:
  workflow_dispatch:
    inputs:
      approve_readonly_check:
        description: 'READ ONLY: inspect the dedicated test secret privately, never reveal values or deploy resources'
        type: choice
        required: true
        options:
          - DO_NOT_CHECK
          - I_AUTHORIZE_READ_ONLY_TEST_SECRET_CHECK
        default: DO_NOT_CHECK

permissions:
  contents: read
  id-token: write

concurrency:
  group: hustle-payment-preview-readonly-secret-check
  cancel-in-progress: false

jobs:
  preview-credential-check:
    if: >-
      github.repository == 'realxpen/hustle-economy-of-you' &&
      github.ref == 'refs/heads/main' &&
      inputs.approve_readonly_check == 'I_AUTHORIZE_READ_ONLY_TEST_SECRET_CHECK'
    runs-on: ubuntu-24.04
    environment: hustle-payment-preview-api
    timeout-minutes: 10
    env:
      HUSTLE_PREVIEW_SECRET_CHECK: I_AUTHORIZE_READ_ONLY_TEST_SECRET_CHECK
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the isolated validator offline
        run: |
          node scripts/payment-preview/check-aws-secret-readiness-tests.mjs
      - name: Assume ONLY the dedicated preview AWS role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::707859598737:role/hustle-github-payment-preview-deployer
          aws-region: eu-west-2
          role-session-name: hustle-preview-secret-check
      - name: Validate secret privately in runner (no values printed or changed)
        run: node scripts/payment-preview/check-aws-secret-readiness.mjs
