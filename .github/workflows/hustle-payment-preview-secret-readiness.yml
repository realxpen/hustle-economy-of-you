name: Hustle Payment Preview Secret Readiness (read-only)

# No infrastructure provisioning, no public APIs, and no Paystack requests.
on:
  workflow_dispatch:
    inputs:
      confirm_read_only:
        description: 'Inspect ONLY the dedicated TEST secret, do not deploy or alter AWS'
        type: choice
        required: true
        options:
          - DO_NOT_CHECK
          - CHECK_TEST_SECRET_READ_ONLY
        default: DO_NOT_CHECK

permissions:
  contents: read
  id-token: write

concurrency:
  group: hustle-payment-preview-secret-readiness
  cancel-in-progress: false

jobs:
  read-only-check:
    if: >-
      github.repository == 'realxpen/hustle-economy-of-you' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm_read_only == 'CHECK_TEST_SECRET_READ_ONLY'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: hustle-payment-preview-api
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check immutable repo and exact AWS identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "realxpen/hustle-economy-of-you"
          test "$GITHUB_REF" = "refs/heads/main"
          node --check scripts/payment-preview/check-aws-secret-readiness.mjs
          node scripts/payment-preview/check-aws-secret-readiness.test.mjs
      - name: Assume dedicated preview AWS OIDC role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::707859598737:role/hustle-github-payment-preview-deployer
          aws-region: eu-west-2
          role-session-name: hustle-payment-preview-readiness-only
      - name: Check AWS account and read-only preview secret shape
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "707859598737"
          test "$(aws secretsmanager describe-secret --secret-id hustle-payment-preview-credentials --region eu-west-2 --query Name --output text)" = "hustle-payment-preview-credentials"
          # SecretString stays inside the OS pipe; never echo, log, print or
          # expose it as GitHub Actions output, argument or environment variable.
          aws secretsmanager get-secret-value \
            --secret-id hustle-payment-preview-credentials \
            --region eu-west-2 --query SecretString --output text \
            | node scripts/payment-preview/check-aws-secret-readiness.mjs
      - name: Confirm no deployment occurred
        run: echo 'PASS: offline and AWS metadata/secret read-only inspection; no changes made.'
