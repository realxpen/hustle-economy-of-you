name: Hustle Expo Font Lock Reconciliation (cloud only)

# Temporary owner-branch workflow: update lockfile for SDK54-compatible Expo Font
# without accessing production, Expo build credits, or developer workstations.
on:
  push:
    branches: [test/mobile-free-native-gradle-diagnosis]
    paths:
      - package.json
      - apps/mobile/package.json
      - .github/workflows/hustle-mobile-font-lock-reconcile.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hustle-font-lock-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.repository == 'realxpen/hustle-economy-of-you' && github.ref == 'refs/heads/test/mobile-free-native-gradle-diagnosis'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconcile only the tracked npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify locked workspace installation and fonts
        run: |
          npm ci
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const root = require('./package.json');
          const mobile = require('./apps/mobile/package.json');
          const lock = require('./package-lock.json');
          assert.equal(root.overrides['expo-font'], '14.0.12');
          assert.equal(mobile.dependencies['@expo/vector-icons'], '15.0.3');
          assert.equal(mobile.dependencies['expo-font'], '14.0.12');
          const versions = Object.entries(lock.packages)
            .filter(([path]) => path.endsWith('/expo-font'))
            .map(([path,p]) => ({path, version:p.version}));
          assert.ok(versions.length, 'No expo-font installed');
          assert.ok(versions.every(v => v.version === '14.0.12'), 'Unexpected expo-font installed: ' + JSON.stringify(versions));
          console.log('SDK54 expo-font dependencies validated:', JSON.stringify(versions));
          NODE
      - name: Commit reviewed dependency lockfile on same feature branch
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already consistent."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(mobile): reconcile Expo SDK54 font and icon dependency lock"
          git push origin HEAD:refs/heads/test/mobile-free-native-gradle-diagnosis
