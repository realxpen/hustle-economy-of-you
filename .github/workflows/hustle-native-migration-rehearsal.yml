name: Hustle Saved Native Pending SQL Rehearsal

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type REHEARSE_SAVED_MIGRATIONS to test the five reviewed SQL files on a disposable restored copy'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hustle-private-native-backup-access
  cancel-in-progress: false

jobs:
  generated-gate:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.confirm == 'REHEARSE_SAVED_MIGRATIONS' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test generated SQL execution, row hashing, defaults and permissions
        run: python scripts/recovery/native_contract/pending_migrations.py

  private-rehearsal:
    needs: generated-gate
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.confirm == 'REHEARSE_SAVED_MIGRATIONS' }}
    environment: hustle-cloud-recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install hash-locked authentication dependencies before exposing credentials
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r scripts/recovery/native_contract/requirements.lock
      - name: Apply the five reviewed SQL files only to the new native restore
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUNBUFFERED: '1'
          HUSTLE_GENERATED_GATE: passed
          HUSTLE_REHEARSAL_CONFIRM: ${{ inputs.confirm }}
          HUSTLE_RESTORE_DRIVE_SA_JSON: ${{ secrets.HUSTLE_RESTORE_DRIVE_SA_JSON }}
          HUSTLE_NATIVE_BACKUP_PASSPHRASE: ${{ secrets.HUSTLE_NATIVE_BACKUP_PASSPHRASE }}
        run: python scripts/recovery/native_contract/private_pending_migrations.py
      - name: Verify temporary-container cleanup
        if: always()
        run: |
          PYTHONPATH=scripts/recovery/native_contract python -c 'import cloud_contract; cloud_contract.assert_clean()'
      - name: Keep the aggregate rehearsal result
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hustle-native-pending-sql
          path: ${{ runner.temp }}/hustle-native-pending-sql.json
          if-no-files-found: error
          retention-days: 7
