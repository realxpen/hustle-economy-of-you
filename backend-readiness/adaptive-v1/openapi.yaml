openapi: 3.1.0
info:
  title: Hustle Adaptive Economy API (backend implementation contract)
  version: 0.1.0-draft
  description: |
    Proposed authenticated server API for one identity, business workspaces,
    configurable services, universal work, opportunities, resources, delegations,
    evidence, notifications and safe payment references.
    SPECIFICATION ONLY. No routes in this file are deployed.
servers:
  - url: https://api.example.invalid/v1
    description: Placeholder. Never use for production.
security:
  - bearerAuth: []
tags:
  - name: Identity
  - name: Workspaces
  - name: Delegation
  - name: Services
  - name: Opportunities
  - name: Work
  - name: Resources
  - name: Reputation
  - name: Notifications
paths:
  /me/capabilities:
    get:
      tags: [Identity]
      summary: Read authenticated user's economic capabilities
      responses:
        "200":
          description: Capability grants (no payment or business permission implication)
          content:
            application/json:
              schema:
                type: object
                properties:
                  capabilities:
                    type: array
                    items:
                      type: string
        "401":
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Identity]
      summary: Opt in to a nonprivileged capability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [capability]
              properties:
                capability:
                  enum: [hire, offer, sell, create, teach, manage, represent, learn]
      responses:
        "200":
          description: Capability updated; no verification or delegated permission granted
        "400":
          $ref: '#/components/responses/BadRequest'
  /workspaces:
    get:
      tags: [Workspaces]
      summary: Workspaces where this user is an active member
      responses:
        "200":
          description: User-visible workspaces, including personal
    post:
      tags: [Workspaces]
      summary: Create a business/team/agency under authenticated ownership
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, kind]
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 120
                kind:
                  enum: [business, team, agency]
                category:
                  type: string
      responses:
        "201":
          description: Created workspace, owner membership, audit event
        "409":
          $ref: '#/components/responses/Conflict'
  /workspaces/{workspaceId}/members:
    get:
      tags: [Workspaces]
      summary: List members visible to authorized workspace principals
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        "200":
          description: Scoped roster, not private identity data
  /workspaces/{workspaceId}/delegations:
    post:
      tags: [Delegation]
      summary: Invite an agent or staff member with explicit permission scope
      description: |
        Requires owner authority. Cannot grant identity.approve, wallet.withdraw,
        payout.change, escrow.release, delegate.grant or wildcard access.
        The invited principal is not active until THEY authenticate and accept.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invitee, role, permissions]
              properties:
                invitee:
                  type: string
                  description: An eligible user identifier or verified contact resolution token
                role:
                  enum: [agent, assistant, manager, worker, accountant]
                permissions:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    enum: [services.manage, work.manage, messages.reply, schedule.manage, finance.view]
                expiresAt:
                  type: string
                  format: date-time
      responses:
        "202":
          description: Consent pending; invitation event queued
        "403":
          $ref: '#/components/responses/Forbidden'
  /delegations/{invitationId}/accept:
    post:
      tags: [Delegation]
      summary: Invited authenticated party explicitly accepts permission scope
      parameters:
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Accepted grant, immutable consent audit record
        "403":
          $ref: '#/components/responses/Forbidden'
  /delegations/{invitationId}/revoke:
    post:
      tags: [Delegation]
      summary: Owner or invited party revokes grant
      parameters:
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Grant revoked; active sessions and tasks reauthorized
  /blueprints:
    get:
      tags: [Services]
      summary: Versioned library of 9 configurable service blueprints
      responses:
        "200":
          description: Published blueprint versions and capabilities
  /workspaces/{workspaceId}/services:
    post:
      tags: [Services]
      summary: Create a draft service and pin a blueprint version
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, blueprintId, basePriceMinor, currency]
              properties:
                title:
                  type: string
                blueprintId:
                  type: string
                  format: uuid
                basePriceMinor:
                  type: integer
                  minimum: 0
                currency:
                  type: string
                  example: NGN
                requirements:
                  type: object
                  additionalProperties: true
                policy:
                  type: object
                  additionalProperties: true
      responses:
        "201":
          description: Service created; cannot overwrite accepted quote snapshots
        "403":
          $ref: '#/components/responses/Forbidden'
  /opportunities:
    post:
      tags: [Opportunities]
      summary: Create a need-based request draft with privacy defaults
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description]
              properties:
                title:
                  type: string
                  minLength: 5
                description:
                  type: string
                  minLength: 12
                serviceType:
                  type: string
                budgetMinor:
                  type: integer
                  minimum: 0
                publicArea:
                  type: string
                visibility:
                  enum: [private, invited, public]
                  default: private
      responses:
        "201":
          description: Opportunity created; no unsolicited supplier outreach
  /opportunities/{opportunityId}/matches:
    get:
      tags: [Opportunities]
      summary: Explainable recommendations for services relevant to an opportunity
      parameters:
        - name: opportunityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Available verified service candidates and grounded reasons
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    serviceId:
                      type: string
                      format: uuid
                    reason:
                      type: string
                    source:
                      type: string
  /work-orders:
    get:
      tags: [Work]
      summary: Work visible to the authenticated client or authorized workspace
      parameters:
        - name: workspaceId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Authorized work records with status and version
    post:
      tags: [Work]
      summary: Create durable work record from agreed service, content CTA or opportunity
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providerWorkspaceId, title, blueprintType]
              properties:
                providerWorkspaceId:
                  type: string
                  format: uuid
                serviceId:
                  type: string
                  format: uuid
                opportunityId:
                  type: string
                  format: uuid
                blueprintType:
                  type: string
                title:
                  type: string
                requirements:
                  type: object
                  additionalProperties: true
                proposedStartAt:
                  type: string
                  format: date-time
      responses:
        "201":
          description: Work created in requested state, event appended
        "409":
          $ref: '#/components/responses/Conflict'
  /work-orders/{workId}:
    get:
      tags: [Work]
      summary: Work detail, agreement version, scope and permitted actions
      parameters:
        - $ref: '#/components/parameters/WorkId'
      responses:
        "200":
          description: Authorized snapshot with ETag or version
        "403":
          $ref: '#/components/responses/Forbidden'
  /work-orders/{workId}/transitions:
    post:
      tags: [Work]
      summary: Transition with optimistic version and actor authorization
      parameters:
        - $ref: '#/components/parameters/WorkId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: If-Match
          in: header
          required: true
          description: Expected work-order revision; stale revisions return 409
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toStatus]
              properties:
                toStatus:
                  enum: [awaiting_approval, accepted, in_progress, ready, out_for_delivery, delivered, review, completed, disputed, cancelled, declined]
                note:
                  type: string
                evidenceIds:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        "200":
          description: Atomic status update + work event + outbox notification
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/Conflict'
  /work-orders/{workId}/quotes:
    post:
      tags: [Work]
      summary: Professional submits itemized, versioned proposal
      parameters:
        - $ref: '#/components/parameters/WorkId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        "201":
          description: Versioned quote in minor currency units; immutable when accepted
  /quotes/{quoteId}/accept:
    post:
      tags: [Work]
      summary: Actual client accepts terms, including consulted fee credit
      parameters:
        - name: quoteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        "200":
          description: Signed agreement snapshot and accepted quote version
        "403":
          $ref: '#/components/responses/Forbidden'
  /work-orders/{workId}/resources/holds:
    post:
      tags: [Resources]
      summary: Atomically hold all required worker, equipment or room windows
      description: |
        Requires an authenticated request and revalidates calendars in one DB
        transaction. If any requested resource overlaps, NONE are held.
        Expiring holds are released by a reliable job before retry.
      parameters:
        - $ref: '#/components/parameters/WorkId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        "201":
          description: Time-limited resource hold with expiry
        "409":
          $ref: '#/components/responses/Conflict'
  /work-orders/{workId}/evidence:
    post:
      tags: [Reputation]
      summary: Register protected uploaded evidence and permission to publish
      parameters:
        - $ref: '#/components/parameters/WorkId'
      responses:
        "201":
          description: Private evidence reference; moderation and review remain separate
  /work-orders/{workId}/reviews:
    post:
      tags: [Reputation]
      summary: Record client-authored feedback for completed work
      parameters:
        - $ref: '#/components/parameters/WorkId'
      responses:
        "201":
          description: Work-confirmed review, subject-scoped to person or business
        "409":
          $ref: '#/components/responses/Conflict'
  /notifications/preferences:
    get:
      tags: [Notifications]
      summary: Read personal opt-in choices by category and channel
      responses:
        "200":
          description: Authorized preferences
    put:
      tags: [Notifications]
      summary: Update consent for push, email, SMS or in-app delivery
      responses:
        "200":
          description: Saved preferences
  /payments/references:
    post:
      tags: [Work]
      summary: Server-only integration with reviewed payment custody provider
      description: |
        DO NOT expose to browser or agent permissions. Webhooks alone confirm
        payment state. This endpoint is reserved for a future approved backend.
      responses:
        "501":
          description: Not implemented until money-movement architecture approved
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 12
        maxLength: 128
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkId:
      name: workId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Missing or invalid authentication
    Forbidden:
      description: Valid identity without specific workspace or actor permission
    Conflict:
      description: Version changed, overlapping reservation or idempotency conflict
    BadRequest:
      description: Invalid input or disallowed capability
