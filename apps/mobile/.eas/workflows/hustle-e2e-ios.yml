name: Hustle iOS Cloud Smoke (manual)

jobs:
  build_ios_simulator:
    name: Build nonproduction iOS simulator app
    type: build
    params:
      platform: ios
      profile: e2e-test
  maestro_ios:
    name: Verify unified-account entry
    needs: [build_ios_simulator]
    type: maestro
    params:
      build_id: ${{ needs.build_ios_simulator.outputs.build_id }}
      flow_path: .maestro/auth-smoke.yml
