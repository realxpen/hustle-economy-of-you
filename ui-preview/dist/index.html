 .phone.chrome-hidden .post-badge{bottom:calc(190px + env(safe-area-inset-bottom))}
 .phone.chrome-hidden .media-dots{bottom:calc(16px + env(safe-area-inset-bottom))}
}

/* V1 iPhone visible-state refinement: preserve full-screen feed priority. */
@media (max-width:550px){
  .top-head{padding:8px 15px 3px;min-height:41px}
  .brand{font-size:23px;color:var(--text);opacity:1;filter:none;-webkit-filter:none;-webkit-font-smoothing:antialiased;text-shadow:none}
  .top-actions .round-ctl{width:34px;height:34px;opacity:1;filter:none}
  .feed-ranks{padding:0 0 3px;gap:21px}
  .feed-ranks button{padding:5px 1px}
  .story-zone{padding:0 11px 6px;align-items:center}
  .story-item{width:46px;gap:3px;min-height:58px}
  .story-ring{width:42px;height:42px}
  .story-live{top:34px}
  .story-more-ring{width:42px;height:42px}
  .story-name{margin-top:1px}
  .feed-chrome-top{background:linear-gradient(180deg,rgba(247,249,244,.97) 0%,rgba(247,249,244,.92) 40%,rgba(247,249,244,.72) 75%,rgba(247,249,244,.03) 100%)}
  .dark .feed-chrome-top{background:linear-gradient(180deg,rgba(19,29,21,.97) 0%,rgba(19,29,21,.92) 40%,rgba(19,29,21,.74) 75%,rgba(19,29,21,.03) 100%)}
}


/* Stories relocation — compact entry point, immersive Feed first */
.stories-entry{display:inline-flex;align-items:center;gap:6px;flex-shrink:0;background:var(--paper);color:var(--text);border:1px solid var(--line);border-radius:24px;padding:4px 10px 4px 5px;min-height:36px;font-size:11px;font-weight:850;white-space:nowrap}
.stories-entry-ring{width:27px;height:27px;flex:none;padding:3px;border-radius:50%;background:conic-gradient(#a7d44d,#d9ff76,#83b033,#a7d44d);display:grid;place-items:center}
.stories-entry-ring span{display:grid;place-items:center;width:100%;height:100%;background:var(--paper);border-radius:50%;font-size:14px;color:#63892d}
.story-tray-intro{font-size:12px;line-height:1.5;margin:0 0 14px;color:var(--muted)}
.story-tray-items{display:flex;flex-wrap:wrap;gap:14px 16px;padding:7px 0 17px;justify-content:flex-start}
.story-tray-items .story-item{min-width:57px;width:calc((100% - 64px)/5);max-width:68px;min-height:79px;color:var(--text)}
.story-tray-items .story-ring{height:54px;width:54px}
.story-tray-items .story-live{top:43px}
.story-tray-items .story-name{font-size:11px}
.story-tray-explore{display:flex;align-items:center;justify-content:space-between;width:100%;background:#e8f7d1;border:1px solid #c4e5a0;border-radius:14px;padding:14px 16px;color:#233c20;font-weight:850;font-size:12px}
.story-tray-explore span{font-size:19px}
.stories-discover{display:flex;align-items:center;gap:10px;margin-top:18px;border:1px solid var(--line);border-radius:17px;padding:13px;background:var(--paper);color:var(--text)}
.stories-discover-mark{border:3px solid #b8df63;color:#6f9630;border-radius:50%;height:43px;width:43px;display:grid;place-items:center;font-size:19px;flex-shrink:0}
.stories-discover>div{flex:1;min-width:0}
.stories-discover b{font-size:12px;display:block;margin-bottom:5px}
.stories-discover small{font-size:10px;color:var(--muted);display:block;line-height:1.4}
.stories-discover button{border:0;border-radius:12px;background:var(--acid);font-size:11px;color:#142014;font-weight:900;white-space:nowrap;padding:10px}
@media(max-width:550px){.top-actions{gap:6px}.stories-entry{padding:3px 8px 3px 4px;min-height:34px;font-size:10px}.stories-entry-ring{width:26px;height:26px}.feed-chrome-top{background:linear-gradient(180deg,rgba(247,249,244,.97) 0%,rgba(247,249,244,.88) 68%,transparent 100%)}.dark .feed-chrome-top{background:linear-gradient(180deg,rgba(19,29,21,.97) 0%,rgba(19,29,21,.88) 68%,transparent 100%)}.post-top-more{top:calc(110px + env(safe-area-inset-top))}.slide-count{top:calc(112px + env(safe-area-inset-top))}.story-tray-items{column-gap:9px}}
@media(max-width:350px){.top-actions .round-ctl{width:31px;height:31px}.brand{font-size:21px}.stories-entry{padding-right:6px;font-size:10px}.stories-entry-ring{width:23px;height:23px}}
</style>

const number=v=>v>=1000?(v/1000).toFixed(1)+'k':String(v);
const flash=s=>{toastNode.innerHTML=`<div class="toast">${ec(s)}</div>`;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>toastNode.innerHTML='',2200)};
function order(){if(rank==='Following')return [posts[1],posts[0],posts[3],posts[2]];if(rank==='Nearby')return [posts[0],posts[2],posts[4],posts[1]];return posts}
function storiesMarkup(){return creators.slice(0,5).map((c,i)=>`<button class="story-item" data-story="${i}" aria-label="View ${ec(c.name)}'s story"><span class="story-ring"><span class="story-initial">${ec(c.name[0])}</span><img src="${c.avatar}" alt="" onerror="this.style.display='none'"></span>${c.live?'<span class="story-live">LIVE</span>':''}<span class="story-name">${ec(c.name)}</span></button>`).join('')}
function renderPost(p,index){const c=creator(p.creator),page=slideFor[p.id]||0;
return `<article class="post" id="${p.id}" aria-label="Post by ${ec(c.full)}"><div class="post-image" data-post-image="${p.id}"><img src="${p.images[page]}" alt="${ec(c.full)}'s ${ec(p.category.toLowerCase())} work"><div class="post-badge">✦ &nbsp; POST · ${ec(p.category)}</div><button class="post-top-more" aria-label="More post options" data-more="${p.id}">···</button>
${p.type==='carousel'?`<div class="slide-count">${page+1}/${p.images.length}</div><div class="slide-controls"><button data-slide="${p.id}" data-shift="-1" aria-label="Previous photo">‹</button><button data-slide="${p.id}" data-shift="1" aria-label="Next photo">›</button></div>`:''}
<div class="rail"><button data-like="${p.id}" aria-label="Like ${ec(c.full)}'s post" class="${liked.has(p.id)?'active like':''}"><span class="action-ico">${icon('heart',liked.has(p.id))}</span><span>${number(p.likes+(liked.has(p.id)?1:0))}</span></button><button data-comments="${p.id}" aria-label="Comments"><span class="action-ico">${icon('chat')}</span><span>${p.comments+(commentsFor[p.id]?.length||0)}</span></button><button data-save="${p.id}" aria-label="Save"><span class="action-ico">${icon('bookmark',saved.has(p.id))}</span><span>${saved.has(p.id)?'Saved':'Save'}</span></button><button data-share="${p.id}" aria-label="Share"><span class="action-ico">${icon('share')}</span><span>Share</span></button></div>
<div class="post-foot"><div class="creator-line"><img class="creator-avatar" src="${c.avatar}" alt=""><div class="creator-text"><button class="creator-name" data-profile="${c.id}">${ec(c.full)} <span class="verified">✓</span></button><div class="creator-meta">${ec(c.handle)} &nbsp;•&nbsp; ${ec(c.location)}</div></div></div><p class="post-caption">${ec(p.caption)}</p><div class="mini-offer"><div class="offer-copy"><b>${ec(p.service)}</b><span>From ${ec(p.price)}</span></div><button class="offer-btn" data-cta="${p.id}">${p.cta==='Buy'?'Buy product':'Hire now'} &nbsp;→</button></div></div>${p.type==='carousel'?`<div class="media-dots">${p.images.map((_,i)=>`<i class="${page===i?'on':''}"></i>`).join('')}</div>`:''}</div><div class="post-under"><span>${p.type==='carousel'?'Swipe through the work · '+p.images.length+' photos':'Photo post · '+number(p.likes+(liked.has(p.id)?1:0))+' likes'}</span><button data-comments="${p.id}">View comments →</button></div></article>`}
function renderPosts(keepScroll=true){const t=scroller.scrollTop;postsNode.innerHTML=order().map(renderPost).join('');if(keepScroll)scroller.scrollTop=t;else scroller.scrollTop=0}
function renderRanks(){document.querySelectorAll('[data-rank]').forEach(b=>{const on=b.dataset.rank===rank;b.classList.toggle('active',on);b.setAttribute('aria-selected',String(on))})}
function close(){global.innerHTML='';sheetType='';storyIndex=null;document.body.style.overflow=''}
function openSheet(title,contents,kind){sheetType=kind;global.innerHTML=`<div class="overlay" data-shade><section class="sheet" role="dialog" aria-modal="true" aria-label="${ec(title)}"><div class="sheet-top"><h3>${ec(title)}</h3><button class="close" data-close aria-label="Close">×</button></div>${contents}</section></div>`}
function storyViewer(i){storyIndex=(i+creators.length)%creators.length;const c=creators[storyIndex];global.innerHTML=`<div class="story-view" role="dialog" aria-modal="true" aria-label="${ec(c.name)}'s story"><img src="${c.cover}" alt="Story from ${ec(c.full)}"><div class="story-shade"></div><div class="story-content"><div class="progress">${creators.map((_,j)=>`<span class="${j<=storyIndex?'on':''}"></span>`).join('')}</div><div class="story-person"><img src="${c.avatar}" alt=""><div class="sp-copy"><b>${ec(c.full)}</b><small>${ec(c.handle)} · Story demo</small></div><button data-close aria-label="Close story">×</button></div><div class="story-tap"><button data-story-prev aria-label="Previous story"></button><button data-story-next aria-label="Next story"></button></div><div class="story-bottom"><p>${ec(c.text)}</p><form class="story-reply" data-story-form><input required placeholder="Reply to story..." aria-label="Reply to story"><button type="submit" aria-label="Send reply">↑</button></form></div></div></div>`}
function openStoryTray(){root.classList.remove('chrome-hidden');openSheet('Stories',`<p class="story-tray-intro">See what creators are working on. Tap a Story to watch.</p><div class="story-tray-items">${storiesMarkup()}</div><button class="story-tray-explore" data-action="exploreStories">Explore all Stories <span aria-hidden="true">→</span></button>`,'storyTray')}
function storyExplore(){storyOrigin=view==='Stories'?storyOrigin:view;view='Stories';storyFilter='All';renderStoryExplore()}
function renderStoryExplore(){const kinds=['All','Beauty','Fashion','Creative','Home','Food'],found=creators.filter(c=>storyFilter==='All'||c.category===storyFilter);
global.innerHTML=`<section class="story-explore" aria-label="Explore stories"><div class="explore-head"><button data-back aria-label="Back to feed">←</button><h2>Explore stories<span style="color:#a0cb4e">.</span></h2></div><p class="explore-desc">Find more creators and see what they're making. Tap a story to watch.</p><div class="explore-filters">${kinds.map(k=>`<button data-story-filter="${k}" class="${storyFilter===k?'on':''}">${k}</button>`).join('')}</div><div class="story-grid">${found.map(c=>`<button class="story-tile" data-story="${creators.indexOf(c)}"><img src="${c.cover}" alt=""><b>${ec(c.full)}</b><small>${ec(c.category)} · ${ec(c.location)}</small>${c.live?'<span class="live-marker">LIVE</span>':''}</button>`).join('')}</div></section>`}
function openComments(id){const p=posts.find(x=>x.id===id);if(!p)return;const entries=(commentsFor[id]||[]).map(x=>`<div class="comment"><b>You:</b>${ec(x)}<button data-reply style="border:0;background:none;color:#7ba137;font-size:10px"> Reply</button></div>`).join('');openSheet('Comments & replies',`<div class="comment"><b>@lagos_creative:</b> Really clean work 👏 <button data-reply style="border:0;background:none;color:#7ba137;font-size:10px">Reply</button></div><div class="comment"><b>@taiwo:</b> The attention to detail is everything.</div>${entries}<form data-comment-form="${id}" class="inline-form"><input name="comment" placeholder="Write a comment..." required aria-label="Comment"><button class="lime-btn">Post</button></form><p>Demo comments stay on this device preview only.</p>`,'comments')}
function openSave(id){openSheet('Save to collection',`<p>Keep this work in a collection.</p><div class="collections">${['Inspiration','Hire later','Work ideas'].map(n=>`<button data-collection="${ec(n)}" data-for="${id}">${ec(n)} &nbsp; +</button>`).join('')}</div>`,'save')}
function openProfile(id){const c=creator(id);openSheet(c.full,`<div class="profile-hero"><img src="${c.avatar}" alt=""><div><b>${ec(c.full)} ✓</b><p>${ec(c.category)} · ${ec(c.location)}</p></div></div><p>${ec(c.handle)} · Verified professional (demo)</p><button class="lime-btn" data-from-profile="${id}">Hire / Contact →</button>`,'profile')}
function openHire(id){const p=posts.find(x=>x.id===id),c=creator(p?.creator||id);selection={day:'Tomorrow',time:'11:30 AM'};if(p?.cta==='Buy'){openSheet('Product preview',`<p>${ec(c.full)} · ${ec(p.service)}</p><p>Price: <b>${ec(p.price)}</b></p><button class="lime-btn" data-done>Continue to checkout preview →</button><p>No order or payment is created.</p>`,'buy');return}
openSheet('Consultation with '+c.full,`<p>Discuss your requirements first. Your consultation request is only a demo.</p><p><b>Choose a day</b></p><div style="display:flex;gap:8px"><button class="choice selected" data-day="Tomorrow">Tomorrow</button><button class="choice" data-day="Saturday">Saturday</button></div><p><b>Choose a time</b></p><div style="display:flex;gap:8px"><button class="choice selected" data-time="11:30 AM">11:30 AM</button><button class="choice" data-time="2:00 PM">2:00 PM</button></div><button class="lime-btn" data-done style="width:100%;margin-top:12px">Continue with request →</button><p>No real booking is placed.</p>`,'consultation')}
function nav(to){if(view==='Stories')close();document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===to));if(to==='Home'){let page=global.querySelector('.full-page');if(page)page.remove();return}
const content={Explore:`<h2>Explore talent<span style="color:#9bc941">.</span></h2><p>Search for professionals, skills and services.</p><input class="searchbox" placeholder="Try barber, tailor, photographer" aria-label="Explore search"><div class="profile-hero"><img src="${photos.man}"><div><b>Tobi Adeyemi</b><p>Barbering · Lekki, Lagos</p></div><button class="lime-btn" data-jump-profile="tobi">View</button></div><div class="stories-discover"><span class="stories-discover-mark" aria-hidden="true">✦</span><div><b>Stories from creators</b><small>Quick glimpses of their work and everyday life</small></div><button data-action="exploreStories" aria-label="Explore creator Stories">Explore →</button></div>`,Create:`<h2>Create something<span style="color:#9bc941">.</span></h2><p>Share a normal photo post, carousel or short video featuring your work.</p><textarea class="searchbox" style="min-height:105px" placeholder="Tell the story behind your work..." aria-label="Post caption"></textarea><button class="lime-btn" data-done style="margin-top:12px">Preview draft</button>`,Inbox:`<h2>Inbox<span style="color:#9bc941">.</span></h2><p>Questions, requests and consultations will live here.</p><div class="profile-hero"><img src="${photos.woman}"><div><b>Zara Okafor</b><p>Tap to explore creator profile</p></div><button class="lime-btn" data-jump-profile="zara">View</button></div>`,Profile:`<h2>Your Hustle profile<span style="color:#9bc941">.</span></h2><p>Both a client and a creator—your skills and work in one place.</p><div class="profile-hero"><div style="background:#c8df9a;border-radius:50%;height:58px;width:58px;display:grid;place-items:center;font-size:25px">✳</div><div><b>Sample Hustler</b><p>Showcase work, reviews and skills</p></div></div>`};
const existing=global.querySelector('.full-page');if(existing)existing.remove();root.insertAdjacentHTML('beforeend',`<section class="full-page" role="region" aria-label="${to}"><button class="round-ctl" data-nav="Home" aria-label="Back to Home">←</button>${content[to]||''}</section>`)}
root.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
if(d.rank){rank=d.rank;renderRanks();renderPosts(false);return}
if(d.story!==undefined){storyViewer(Number(d.story));return}
if(d.action==='openStories'){openStoryTray();return}
if(d.action==='exploreStories'){storyExplore();return}
if(d.storyFilter){storyFilter=d.storyFilter;renderStoryExplore();return}
if(d.storyPrev!==undefined){storyViewer((storyIndex??0)-1);return}
if(d.storyNext!==undefined){storyViewer((storyIndex??0)+1);return}
if(d.close!==undefined){const hadExplore=view==='Stories';close();if(hadExplore)renderStoryExplore();return}
if(d.back!==undefined){close();const destination=storyOrigin==='Explore'?'Explore':'Home';view='Home';nav(destination);return}
if(d.like){liked.has(d.like)?liked.delete(d.like):liked.add(d.like);renderPosts();return}
if(d.comments){openComments(d.comments);return}
if(d.save){openSave(d.save);return}
if(d.collection){saved.set(d.for,d.collection);close();renderPosts();flash('Saved to '+d.collection+' (demo)');return}
if(d.share){flash('Sharing preview — no public post URL');return}
if(d.slide){let p=posts.find(x=>x.id===d.slide);slideFor[d.slide]=((slideFor[d.slide]||0)+Number(d.shift)+p.images.length)%p.images.length;renderPosts();return}
if(d.profile){openProfile(d.profile);return}
if(d.fromProfile){openHire(posts.find(x=>x.creator===d.fromProfile)?.id||d.fromProfile);return}
if(d.jumpProfile){openProfile(d.jumpProfile);return}
if(d.cta){openHire(d.cta);return}
if(d.more){openSheet('Post options',`<button class="choice" data-save="${d.more}">Save to collection</button><button class="choice" data-share="${d.more}">Share post</button><button class="choice" data-profile="${posts.find(x=>x.id===d.more)?.creator}">View professional</button>`,'options');return}
if(d.day||d.time){let key=d.day?'day':'time';selection[key]=d[key];t.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('selected',b===t));return}
if(d.done!==undefined){close();flash('Demo only — nothing submitted');return}
if(d.reply!==undefined){const inp=global.querySelector('[name=comment]');if(inp){inp.value='@lagos_creative ';inp.focus()}return}
if(d.nav){nav(d.nav);return}
if(d.action==='theme'){root.classList.toggle('dark');return}
if(d.action==='notifications'){flash('No notifications in this demo');return}
});
root.addEventListener('submit',e=>{e.preventDefault();const frm=e.target;if(frm.dataset.commentForm){let id=frm.dataset.commentForm,val=frm.querySelector('input').value.trim();if(val){(commentsFor[id]??=[]).push(val);renderPosts();openComments(id)}return}if(frm.dataset.storyForm!==undefined){close();flash('Story reply preview — not delivered');return}});
root.addEventListener('click',e=>{if(e.target.hasAttribute('data-shade'))close()});
let sx=0,sy=0;root.addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY},{passive:true});root.addEventListener('touchend',e=>{const target=e.target.closest('[data-post-image]');if(!target)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy,p=posts.find(x=>x.id===target.dataset.postImage);if(p&&p.type==='carousel'&&Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)){slideFor[p.id]=((slideFor[p.id]||0)+(dx<0?1:-1)+p.images.length)%p.images.length;renderPosts()}},{passive:true});

// TikTok-style, snap-to-post scrolling with transient app chrome.
let chromeRevealTimer=null, lastChromeScroll=0, lastWheelNavigation=0;
function revealChromeLater(){clearTimeout(chromeRevealTimer);chromeRevealTimer=setTimeout(()=>root.classList.remove('chrome-hidden'),1500)}
function hideChromeForScroll(){if(view!=='Home'||global.children.length)return;root.classList.add('chrome-hidden');revealChromeLater()}
scroller.addEventListener('scroll',()=>{const y=scroller.scrollTop;if(Math.abs(y-lastChromeScroll)>3){lastChromeScroll=y;hideChromeForScroll()}},{passive:true});
scroller.addEventListener('wheel',e=>{if(view!=='Home'||global.children.length||Math.abs(e.deltaY)<7)return;e.preventDefault();const now=Date.now();if(now-lastWheelNavigation<550)return;lastWheelNavigation=now;const rowHeight=scroller.clientHeight,index=Math.round(scroller.scrollTop/rowHeight),count=scroller.querySelectorAll('.post').length;hideChromeForScroll();scroller.scrollTo({top:Math.max(0,Math.min(count-1,index+(e.deltaY>0?1:-1)))*rowHeight,behavior:'smooth'});},{passive:false});
scroller.addEventListener('keydown',e=>{if(!['ArrowDown','ArrowUp'].includes(e.key)||e.target.closest('button,input,textarea')||global.children.length)return;e.preventDefault();const height=scroller.clientHeight,index=Math.round(scroller.scrollTop/height);const count=scroller.querySelectorAll('.post').length;hideChromeForScroll();scroller.scrollTo({top:Math.max(0,Math.min(count-1,index+(e.key==='ArrowDown'?1:-1)))*height,behavior:'smooth'});});

renderRanks();renderPosts(false);
})();
</script></body></html>
